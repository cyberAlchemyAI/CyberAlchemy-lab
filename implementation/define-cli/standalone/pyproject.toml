[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberalchemy-define"
version = "0.3.0rc2"
description = "Standalone exact-byte Definition Pack preparation for agents and applications"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["jsonschema==4.19.2"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
define-standalone = "define_core:main"
define-api = "define_core:api_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["define_core*"]

[tool.setuptools.package-data]
define_core = ["runtime-manifest.json", "resources/*.json", "schemas/*.json"]
