services:
  lab-fixture:
    platform: linux/amd64
    build:
      context: ${LAB_LOCAL_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
    image: ${LAB_LOCAL_IMAGE:-cyberalchemy-lab-local-host:20261019}
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    working_dir: /workspace
    command: ["python", "-B", "implementation/lab-runtime/local-host/verify_package.py", "--", "python", "-B", "implementation/lab-runtime/local-product/run.py"]
  chain-fixture:
    platform: linux/amd64
    build:
      context: ${LAB_LOCAL_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
    image: ${LAB_LOCAL_IMAGE:-cyberalchemy-lab-local-host:20261019}
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    working_dir: /workspace
    command: ["python", "-B", "implementation/lab-runtime/local-host/verify_package.py", "--", "python", "-B", "implementation/lab-runtime/local-host/chain-fixture/chain.py"]
