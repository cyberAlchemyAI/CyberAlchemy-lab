[package]
name = "cal-ontology-active-runtime"
version = "0.1.0-prototype.1"
edition = "2024"
publish = false

[dependencies]
cal-ontology-execution-envelope = { path = "../../cal-ontology-execution-envelope/v1" }
cal-ontology-lifecycle = { path = "../../../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"

[[bin]]
name = "cal-ontology-active-runtime"
path = "src/main.rs"
