[package]
name = "cal-ontology-graph-read-model"
version = "0.1.0-prototype.1"
edition = "2024"
publish = false

[dependencies]
cal-ontology-lifecycle = { path = "../../../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cal-ontology-graph-read-model"
path = "src/main.rs"

[[bin]]
name = "generate-event-fixture"
path = "src/bin/generate_event_fixture.rs"

[[bin]]
name = "cal-sustained-ingestion-prototype"
path = "src/bin/sustained_ingestion.rs"
