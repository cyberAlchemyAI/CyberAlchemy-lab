"diagram-connection"><path d="M280,322 L280,346 L500,346 L500,377" class="connector " marker-end="url(#agent-session-arrow)" /></g><g class="diagram-connection"><path d="M720,322 L720,346 L500,346" class="connector dashed" marker-end="url(#agent-session-arrow)" /></g><g class="model-svg-session" data-model-concept="agent"><rect x="84" y="380" width="832" height="213" rx="4" class="boundary session-boundary" /><g class="model-svg-icon" data-model-glyph="agent" transform="translate(112,398)" aria-hidden="true"><rect x="4" y="6" width="16" height="15" rx="3" /><path d="M12 2v4M1 12h3m16 0h3M8 11v2m8-2v2M9 17h6" /></g><text x="500" y="417" class="small-label" text-anchor="middle"><tspan x="500" dy="0">MACHINE AGENT SESSION 12 · temporary</tspan></text><g class="model-svg-node" data-model-concept="agent"><rect x="114" y="440" width="235" height="110" rx="4" class="node normal" /><g class="model-svg-icon" data-model-glyph="agent" transform="translate(130,457)" aria-hidden="true"><rect x="4" y="6" width="16" height="15" rx="3" /><path d="M12 2v4M1 12h3m16 0h3M8 11v2m8-2v2M9 17h6" /></g><text x="166" y="474" class="node-title" text-anchor="start"><tspan x="166" dy="0">Agent instance</tspan></text><text x="231.5" y="500" class="node-sub" text-anchor="middle"><tspan x="231.5" dy="0">Investigation assignment </tspan><tspan x="231.5" dy="21">Separate delegation</tspan></text></g><g class="model-svg-node" data-model-concept="agent"><rect x="383" y="440" width="235" height="110" rx="4" class="node normal" /><g class="model-svg-icon" data-model-glyph="agent" transform="translate(399,457)" aria-hidden="true"><path d="M14 4a6 6 0 0 0-6 8L3 17a2.8 2.8 0 0 0 4 4l5-5a6 6 0 0 0 8-6l-4 3-4-4Z" /></g><text x="435" y="474" class="node-title" text-anchor="start"><tspan x="435" dy="0">Actions and tools</tspan></text><text x="500.5" y="500" class="node-sub" text-anchor="middle"><tspan x="500.5" dy="0">Compare identifiers </tspan><tspan x="500.5" dy="21">Record result and limits</tspan></text></g><g class="session-notes"><g class="model-svg-node" data-model-concept="agent"><rect x="652" y="440" width="235" height="110" rx="4" class="node ochre" /><g class="model-svg-icon" data-model-glyph="agent" transform="translate(668,457)" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M7 9h10M7 13h7M7 17h4" /></g><text x="704" y="474" class="node-title" text-anchor="start"><tspan x="704" dy="0">Session Memory</tspan></text><text x="769.5" y="500" class="node-sub" text-anchor="middle"><tspan x="769.5" dy="0">Working notes only </tspan><tspan x="769.5" dy="21">Cleared on termination</tspan></text></g></g></g><text x="500" y="627" class="edge-label" text-anchor="middle"><tspan x="500" dy="0">Useful output → authorized recording → project records with their own standing</tspan></text></svg>