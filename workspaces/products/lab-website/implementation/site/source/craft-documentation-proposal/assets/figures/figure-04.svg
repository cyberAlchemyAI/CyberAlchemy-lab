<svg xmlns="http://www.w3.org/2000/svg" width="620" height="585" viewBox="0 0 620 585" role="img" aria-labelledby="title desc">
<title id="title">The capacity decision has two normal outcomes and no mutation</title><desc id="desc">The supplied snapshot is evaluated by Within capacity. Requested units strictly below available units produce Accept. Equality or a larger request produces Reject. Both branches return without changing state.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#817a70"/></marker></defs>
<rect width="100%" height="100%" fill="#fffdf8"/>
<g font-family="Helvetica Neue, Arial, sans-serif"><path d="M 310,100 L 310,150" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 310,290 L 310,325 L 150,325 L 150,360" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 310,290 L 310,325 L 470,325 L 470,360" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 150,430 L 150,462 L 310,462 L 310,490" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 470,430 L 470,462 L 310,462 L 310,490" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="160" y="20" width="300" height="80" rx="7" fill="#eef4fb" stroke="#6488b6" stroke-width="1.5"/><text x="310.0" y="65.0" text-anchor="middle" fill="#17395f" font-size="16" font-weight="600">Supplied capacity snapshot</text></g><g><polygon points="310.0,150 480,220.0 310.0,290 140,220.0" fill="#fff3e9" stroke="#c68455" stroke-width="1.5"/><text x="310.0" y="203.0" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">Within capacity?</text><text x="310.0" y="225.0" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">requested_units &lt;</text><text x="310.0" y="247.0" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">available_units</text></g><g><rect x="50" y="360" width="200" height="70" rx="7" fill="#edf6ef" stroke="#77a585" stroke-width="1.5"/><text x="150.0" y="400.0" text-anchor="middle" fill="#235439" font-size="16" font-weight="600">Accept</text></g><g><rect x="370" y="360" width="200" height="70" rx="7" fill="#fff0f0" stroke="#bd7d87" stroke-width="1.5"/><text x="470.0" y="400.0" text-anchor="middle" fill="#7d2435" font-size="16" font-weight="600">Reject</text></g><g><rect x="160" y="490" width="300" height="75" rx="7" fill="#eef4fb" stroke="#6488b6" stroke-width="1.5"/><text x="310.0" y="521.5" text-anchor="middle" fill="#17395f" font-size="16" font-weight="600">Return the decision</text><text x="310.0" y="543.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">State unchanged</text></g><g><rect x="123.0" y="311" width="54" height="26" rx="4" fill="#fffdf8"/><text x="150" y="329" text-anchor="middle" font-size="14" fill="#514c46">True</text></g><g><rect x="442.75" y="311" width="54.5" height="26" rx="4" fill="#fffdf8"/><text x="470" y="329" text-anchor="middle" font-size="14" fill="#514c46">False</text></g></g></svg>