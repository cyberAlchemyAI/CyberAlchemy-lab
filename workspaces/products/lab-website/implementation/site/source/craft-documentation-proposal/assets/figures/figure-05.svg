<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="title desc">
<title id="title">Typed references connect the pure capacity classifier to its inputs, Rule and result</title><desc id="desc">Classify capacity is a Calculation. Its input type refers to Capacity snapshot, its condition calls Within capacity through a typed Rule reference, and its result type refers to Capacity decision. All three arrows represent typed references, not authored graph relationship kinds.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#817a70"/></marker></defs>
<rect width="100%" height="100%" fill="#fffdf8"/>
