fill="#514c46">calls Rule</text></g><g><rect x="556.5" y="51" width="91.0" height="26" rx="4" fill="#fffdf8"/><text x="602" y="69" text-anchor="middle" font-size="14" fill="#514c46">input type</text></g><g><rect x="390.85" y="187" width="98.3" height="26" rx="4" fill="#fffdf8"/><text x="440" y="205" text-anchor="middle" font-size="14" fill="#514c46">result type</text></g></g></svg>