# DomainSpec v2 development UI profile — Page. Not canonical DS-D1 authority.
meta_type: Page
category: ui-development
companion: page.md
lifecycle_status: development-profile
candidate_id: DS-D1.15
authority_boundary: implementation-owned development profile only
required_structure:
  attributes_table_columns: [Attribute, Value]
criterion:
  route_path:
    rule: attribute-nonempty/v1
    key: route_path
  terminal:
    rule: attribute-equals
    key: terminal
    value: "true"
  access_context:
    rule: attribute-nonempty/v1
    key: access_context
  primary_content:
    rule: attribute-nonempty/v1
    key: primary_content
  layout_ref:
    rule: attribute-nonempty/v1
    key: layout_ref
  unit_inventory:
    rule: attribute-nonempty/v1
    key: unit_inventory
distinguisher:
  vs: Component
  rule: a Page owns a terminal route and primary content; a Component is non-routable
edge_participation:
  source_of: [renders]
  target_of: [wraps, protects]
correction_contract: add terminal route/content ownership or reroute a non-routable unit to Component
