# DomainSpec v2 meta-type schema — Query (Behavioral). SCHEMA-CONSTITUTION; companion query.md.
meta_type: Query
category: behavioral
companion: query.md
code_pattern: read-only retrieval (read side; no state change, returns a view)

required_structure:
  attributes_table_columns: [Attribute, Value]

criterion:
  read_only:
    rule: attribute-equals
    key: state_change
    value: no

distinguisher:
  vs: Operation
  rule: a Query is read-only (state_change=no); an Operation changes state (state_change=yes)

edge_participation:
  source_of: [reads]
  target_of: [exposes, fetches]

fixtures:
  positive: spec/__fixtures__/mt/query-ok.md
  negative: spec/__fixtures__/mt/query-bad.md
