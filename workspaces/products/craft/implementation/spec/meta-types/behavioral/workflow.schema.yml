# DomainSpec v2 meta-type schema — Workflow (Behavioral). SCHEMA-CONSTITUTION; companion workflow.md.
meta_type: Workflow
category: behavioral
companion: workflow.md
code_pattern: ordered multi-step orchestration within or across declared feature boundaries

required_structure:
  attributes_table_columns: [Attribute, Value]

criterion:
  admitted_scope:
    rule: attribute-one-of
    key: scope
    values: [intra-feature, cross-feature]

distinguisher:
  vs: Operation
  rule: a Workflow coordinates multiple ordered operations; an Operation is one state-changing action

edge_participation:
  source_of: [orchestrates]
  target_of: []

fixtures:
  positive: [spec/__fixtures__/mt/workflow-ok.md, spec/__fixtures__/mt/workflow-cross-feature-ok.md]
  negative: spec/__fixtures__/mt/workflow-bad.md
