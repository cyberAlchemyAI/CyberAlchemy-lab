# DomainSpec v2 meta-type schema — State Machine (Lifecycle). SCHEMA-CONSTITUTION; companion state-machine.md.
meta_type: State Machine
category: lifecycle
companion: state-machine.md
code_pattern: states + valid transitions an entity moves through over time (guards, effects, invariants)

required_structure:
  attributes_table_columns: [Attribute, Value]

criterion:
  has_transitions:
    rule: attribute-equals
    key: has_transitions
    value: yes

distinguisher:
  vs: Enum
  rule: a State Machine has transitions between states (has_transitions=yes); an Enum is a flat value set

edge_participation:
  source_of: []
  target_of: [reflects, transitions]

fixtures:
  positive: spec/__fixtures__/mt/state-machine-ok.md
  negative: spec/__fixtures__/mt/state-machine-bad.md
