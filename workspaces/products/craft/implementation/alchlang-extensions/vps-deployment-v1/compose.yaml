services:
  alch:
    image: ${ALCH_IMAGE:?ALCH_IMAGE must be an exact local image ID}
    restart: unless-stopped
    init: true
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
      - apparmor:alch-host
      - systempaths=unconfined
    mem_limit: 3g
    cpus: '2.0'
    pids_limit: 256
    ports:
      - '127.0.0.1:18081:8081'
    volumes:
      - /srv/alch-host/data:/var/lib/alch
      - /srv/alch-host/runtime:/tmp
      - /srv/alch-host/operator.json:/run/alch/operator.json:ro
    healthcheck:
      test: ['CMD', 'python3', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8081/healthz",timeout=3).read()']
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    labels:
      traefik.enable: 'true'
      traefik.docker.network: troqar_edge
      traefik.http.routers.alch-host.entrypoints: websecure
      traefik.http.routers.alch-host.rule: Host(`alch.cyberalchemylab.com`)
      traefik.http.routers.alch-host.tls: 'true'
      traefik.http.routers.alch-host.tls.certresolver: letsencrypt
      traefik.http.routers.alch-host.middlewares: alch-host-rate
      traefik.http.middlewares.alch-host-rate.ratelimit.average: '20'
      traefik.http.middlewares.alch-host-rate.ratelimit.burst: '40'
      traefik.http.services.alch-host.loadbalancer.server.port: '8081'
    networks: [edge]
networks:
  edge:
    external: true
    name: troqar_edge
