members:
  - id: DS-D1.1
    term: Entity
    category: structural
    criterion_schema: impl/spec/meta-types/structural/entity.schema.yml
    one_line: identity-bearing, lifecycle-tracked object with >=1 identity field
    distinguisher: has identity (a Value Object has none + an Equality clause)
    status: active
    challenge_contract:
      modes: [contradiction, scope]
      contradiction_edge: a concept equal-by-fields that must be tracked by a designated id challenges identity
      owner_route: definitions-governance
      resolution_gate: owner decision + entity.schema.yml fixtures re-run
      blocking_question: must instances be told apart by a designated id, not by their values?
      residue_route: definitions/reviews/
    confirm_contract:
      promotes_when: owner approves + entity.schema.yml pos/neg fixtures discriminate + criterion exercised on >=1 real aspect concept
      gate: definitions-governance owner gate
      status_on_confirm: candidate -> active
  - id: DS-D1.2
    term: Value Object
    category: structural
    criterion_schema: impl/spec/meta-types/structural/value-object.schema.yml
    one_line: immutable value whose identity IS its field tuple (no designated id) + an Equality clause
    distinguisher: identity is the value, not a designated field (an Entity has a designated id)
    status: active
    challenge_contract:
      modes: [contradiction, scope]
      contradiction_edge: an instance equal-by-fields that must be tracked by a designated id challenges no_identity
      owner_route: definitions-governance
      resolution_gate: owner decision + value-object.schema.yml fixtures re-run
      blocking_question: does any instance need a designated id to be distinguished?
      residue_route: definitions/reviews/
    confirm_contract:
      promotes_when: owner approves + value-object.schema.yml pos/neg fixtures discriminate + criterion exercised on >=1 real aspect concept
      gate: definitions-governance owner gate
      status_on_confirm: candidate -> active
  - id: DS-D1.3
    term: Enum
    category: structural
    criterion_schema: impl/spec/meta-types/structural/enum.schema.yml
    one_line: a fixed finite set of named values (a Value table); no typed fields, no identity
    distinguisher: a closed value list (transitions -> State Machine; typed fields -> Entity/Value Object)
    status: active
    challenge_contract:
      modes: [contradiction, scope]
      contradiction_edge: a set whose values must carry fields or transitions challenges value_table
      owner_route: definitions-governance
      resolution_gate: owner decision + enum.schema.yml fixtures re-run
      blocking_question: closed value list, or does each value carry structure or lifecycle?
      residue_route: definitions/reviews/
    confirm_contract:
      promotes_when: owner approves + enum.schema.yml fixtures discriminate + criterion exercised on >=1 real aspect concept
      gate: definitions-governance owner gate
      status_on_confirm: candidate -> active
  - id: DS-D1.4
    term: Operation
    category: behavioral
    criterion_schema: impl/spec/meta-types/behavioral/operation.schema.yml
    one_line: a state-changing business action (declares state_change = yes); the write side
    distinguisher: changes state (a Query is read-only, state_change = no)
    status: active
    challenge_contract:
      modes: [contradiction, scope]
      contradiction_edge: a read-only action mislabeled as state-changing challenges writes_state
      owner_route: definitions-governance
      resolution_gate: owner decision + operation.schema.yml fixtures re-run
      blocking_question: does it actually mutate entity state, or only read?
      residue_route: definitions/reviews/
    confirm_contract:
      promotes_when: owner approves + operation.schema.yml fixtures discriminate + criterion exercised on >=1 real aspect concept
      gate: definitions-governance owner gate
      status_on_confirm: candidate -> active
  - id: DS-D1.5
    term: Query
    category: behavioral
    criterion_schema: impl/spec/meta-types/behavioral/query.schema.yml
