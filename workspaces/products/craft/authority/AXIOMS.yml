version: 1
canonical_surface: projects/domainspec-v2/authority/AXIOMS.md
authority_surface: projects/domainspec-v2/authority/AXIOMS.yml
authority_kind_rollup: Definition
cav2_alignment:
  refs:
    axiom: CAV2-D53
    invariant: CAV2-D54
    authority_kind_enumeration: CAV2-D49
  first_class_authority_kinds:
    axiom: false
    invariant: false
  note: >-
    This R1 continuity surface classifies rows as axiom-shaped or
    invariant-shaped for compatibility with CAV2-D53 and CAV2-D54. Under
    CAV2-D49, axiom and invariant are not first-class authority kinds;
    Definition is a cataloging rollup only.
status: active
owner: DomainSpec v2 owner
human_companion: AXIOMS.md
decision_sources:
  - DEC-DSV2-SPEC-HOMING
  - DEC-B1-SATURN-AXIOM-SCOPE
namespace_note:
  constitution_rules: authority/constitutions/domainspec-v2-CONSTITUTION.md
  avoid_conflation:
    - CAV2-C*
    - RC*
retained_axioms:
  - id: A1
    label: Semantic Authority Precedes Implementation
    status: active
    owner_route: domainspec-v2
    local_role: invariant-shaped
    cav2_shape:
      primary: CAV2-D54
    authority_kind_rollup: Definition
    statement: >-
      Domain semantics are authored in DomainSpec authority, definition, and
      feature-spec surfaces first. Code, workflows, and automation are
      downstream realizations and may not become semantic authority by
      implementation accident.
    primary_binding:
      - authority/source-spine.md
      - authority/constitutions/domainspec-v2-CONSTITUTION.md
    absence_failures:
      - Implementation-first edits introduce behavior that the domain did not authorize.
      - Alignment drift becomes invisible because code appears more current than the authority surface.
  - id: A2
    label: Decisions Belong To The Domain, Not Adapters
    status: active
    owner_route: layering-governance
    local_role: invariant-shaped
    cav2_shape:
      primary: CAV2-D54
    authority_kind_rollup: Definition
    statement: >-
      Domain policy, invariants, dependency law, and state-transition meaning
      belong above the adapter line. Infrastructure adapters may realize
      decisions but may not author them.
    primary_binding:
      - authority/constitutions/domainspec-v2-CONSTITUTION.md#domainspec-v2-c6-forbidden-edges-are-unconstructible-domain-originated-layering-obs-a-rule-level
    downstream_validation:
      - no dependency may cross the adapter line
      - forbidden edges are unconstructible, not merely flagged after the fact
    absence_failures:
      - Adapters accumulate business policy and become hidden domain owners.
      - Cross-layer dependencies become audit findings instead of impossible states.
  - id: A3
    label: Governance Methods Must Be Runnable
    status: active
    owner_route: validation-governance
    local_role: invariant-shaped
    cav2_shape:
      primary: CAV2-D54
    authority_kind_rollup: Definition
    statement: >-
      A governance method that gates critical behavior must have a runnable or
      computable validation path. Review-only prose may guide judgement, but it
      does not close a blocking gate by itself.
    primary_binding:
      - authority/promotion-policy.md
      - authority/constitutions/domainspec-v2-CONSTITUTION.md
    absence_failures:
      - A documented gate looks real while no repeatable check can execute it.
      - Violations are discovered after closeout even though the repo had enough information to block earlier.
routed_material:
  - former_id: A4
    former_label: Observation Must Be Independent From Execution
    r1_treatment: drop-with-pointer
    owner_route: Saturn observer/executor split
    local_role: routed-pointer
    cav2_shape:
      primary: not-applicable
    authority_kind_rollup: Definition
    rationale: Saturn owns the loop closing intent to reality.
  - former_id: A5
    former_label: Control Should Shift Left, Reflection Stays Outer Loop
    r1_treatment: split
    owner_route:
      shift_left: DomainSpec validation governance and C5
      reflection: Saturn reflection loop
    local_role: split-routed-pointer
    cav2_shape:
      primary: CAV2-D54
      retained_domainspec_fragment: CAV2-D54
      routed_saturn_fragment: not-applicable
    authority_kind_rollup: Definition
    rationale: DomainSpec owns shift-left validation controls; Saturn owns the outer reflection loop.
  - former_id: A6
    former_label: Governance Itself Needs A Feedback Budget
    r1_treatment: drop-with-pointer
    owner_route: Saturn feedback-budget loop
    local_role: routed-pointer
    cav2_shape:
      primary: not-applicable
    authority_kind_rollup: Definition
    rationale: Feedback-budget governance belongs to the Saturn loop.
closeout_rules:
  - impl/spec/AXIOMS.md is not an authority surface.
  - Historical references may point at old import evidence only when explicitly about pre-closeout state.
  - Current authority, constitution, source-spine, and future reformulation work should cite authority/AXIOMS.md and authority/AXIOMS.yml.
