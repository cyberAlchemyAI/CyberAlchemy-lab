apiVersion: 1
prune: true
datasources:
  - name: ORODI Prometheus
    uid: orodi-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 2s
  - name: ORODI Loki
    uid: orodi-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      timeout: 30
