# DomainSpec v2 development UI profile — Action. Not canonical DS-D1 authority.
meta_type: Action
category: ui-development
companion: action.md
lifecycle_status: development-profile
candidate_id: DS-D1.21
authority_boundary: implementation-owned development profile only
required_structure:
  attributes_table_columns: [Attribute, Value]
criterion:
  intent:
    rule: attribute-nonempty/v1
    key: intent
  trigger:
    rule: attribute-nonempty/v1
    key: trigger
  target_kind:
    rule: attribute-nonempty/v1
    key: target_kind
  effect_boundary:
    rule: attribute-nonempty/v1
    key: effect_boundary
  success_outcome:
    rule: attribute-nonempty/v1
    key: success_outcome
  error_outcome:
    rule: attribute-nonempty/v1
    key: error_outcome
distinguisher:
  vs: event handler
  rule: an Action owns a complete intent/outcome contract; a passive event handler does not
edge_participation:
  source_of: []
  target_of: [submits]
correction_contract: add a named intent/target/effect/outcome contract, or reroute passive handlers to framework vocabulary
