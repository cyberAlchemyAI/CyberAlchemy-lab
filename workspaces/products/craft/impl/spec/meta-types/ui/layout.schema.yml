# DomainSpec v2 development UI profile — Layout. Not canonical DS-D1 authority.
meta_type: Layout
category: ui-development
companion: layout.md
lifecycle_status: development-profile
candidate_id: DS-D1.16
authority_boundary: implementation-owned development profile only
required_structure:
  attributes_table_columns: [Attribute, Value]
criterion:
  slots:
    rule: attribute-nonempty/v1
    key: slots
  shared_chrome:
    rule: attribute-nonempty/v1
    key: shared_chrome
  page_specific_content:
    rule: attribute-equals
    key: page_specific_content
    value: "false"
  wrap_target:
    rule: attribute-equals
    key: wrap_target
    value: Page
distinguisher:
  vs: Page
  rule: a Layout owns shell slots; a Page owns terminal primary content
edge_participation:
  source_of: [wraps]
  target_of: []
correction_contract: add finite slots/shared chrome and a Page wrap target, or reroute primary-content ownership to Page
