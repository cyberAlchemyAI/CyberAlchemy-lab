# DomainSpec v2 development UI profile — Form. Not canonical DS-D1 authority.
meta_type: Form
category: ui-development
companion: form.md
lifecycle_status: development-profile
candidate_id: DS-D1.20
authority_boundary: implementation-owned development profile only
required_structure:
  attributes_table_columns: [Attribute, Value]
criterion:
  typed_fields:
    rule: attribute-nonempty/v1
    key: typed_fields
  validation_contract:
    rule: attribute-nonempty/v1
    key: validation_contract
  error_contract:
    rule: attribute-nonempty/v1
    key: error_contract
  submission_action:
    rule: attribute-nonempty/v1
    key: submission_action
  target_interface:
    rule: attribute-nonempty/v1
    key: target_interface
  error_mapping:
    rule: attribute-nonempty/v1
    key: error_mapping
distinguisher:
  vs: Component
  rule: a Form owns a field-validation-submission aggregate; a Component owns only typed visual I/O
edge_participation:
  source_of: [submits, contracts]
  target_of: []
correction_contract: add the full validation/submission aggregate, or reroute passive typed visual units to Component
