# DomainSpec v2 meta-type schema — Policy (Behavioral). SCHEMA-CONSTITUTION; companion policy.md.
meta_type: Policy
category: behavioral
companion: policy.md
code_pattern: decision logic that selects a strategy/branch at runtime (chooses how, not whether)

required_structure:
  attributes_table_columns: [Attribute, Value]

criterion:
  selects_strategy:
    rule: attribute-equals
    key: formal_return_type
    value: strategy

distinguisher:
  vs: Rule
  rule: a Policy selects a strategy; a Rule returns a boolean (blocks/allows)

edge_participation:
  source_of: [applies]
  target_of: []

fixtures:
  positive: spec/__fixtures__/mt/policy-ok.md
  negative: spec/__fixtures__/mt/policy-bad.md
