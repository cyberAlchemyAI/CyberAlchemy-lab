# DomainSpec v2 meta-type schema — Value Object (Structural category).
# Canonical machine criterion (SCHEMA-CONSTITUTION). Companion: value-object.md. Loaded by tools/validate-content.ts.
# Shape only — never semantic satisfiability (moat). Decidable table-walk / section-scan.
meta_type: Value Object
category: structural
companion: value-object.md
code_pattern: immutable value defined entirely by its fields, no identity (embedded or shared)

required_structure:
  fields_table_columns: [Field, Type, Required, Identity, Description]

criterion:
  no_identity:
    rule: none
    column: Identity
    truthy: [yes, "true", "✓"]
  typedness:
    rule: all-nonempty
    column: Type
  equality:
    rule: section-contains
    pattern: equal

distinguisher:
  vs: Entity
  rule: a Value Object has NO identity field and declares an Equality clause; an Entity has identity

edge_participation:
  source_of: []
  target_of: [contains]

fixtures:
  positive: spec/__fixtures__/mt/value-object-ok.md
  negative: spec/__fixtures__/mt/value-object-bad.md
