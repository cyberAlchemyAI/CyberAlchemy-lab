# DomainSpec v2 meta-type schema — Enum (Structural category).
# Canonical machine criterion (SCHEMA-CONSTITUTION). Companion: enum.md. Loaded by tools/validate-content.ts.
# Shape only — never semantic satisfiability (moat). Decidable table-walk.
meta_type: Enum
category: structural
companion: enum.md
code_pattern: fixed finite set of named values (string-union / const enum)

required_structure:
  value_table_columns: [Value, Description]

criterion:
  value_table:
    rule: table-has-column
    column: Value

distinguisher:
  vs: Entity
  rule: an Enum is a finite Value table (Value + Description); it has no typed field table and no identity

edge_participation:
  source_of: []
  target_of: []

fixtures:
  positive: spec/__fixtures__/mt/enum-ok.md
  negative: spec/__fixtures__/mt/enum-bad.md
