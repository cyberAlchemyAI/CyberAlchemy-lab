# DomainSpec v2 meta-type schema — Event (Connective). SCHEMA-CONSTITUTION; companion event.md.
meta_type: Event
category: connective
companion: event.md
code_pattern: past-tense notification of a domain state change; typed payload; consumers

required_structure:
  attributes_table_columns: [Attribute, Value]

criterion:
  past_tense:
    rule: attribute-equals
    key: temporal
    value: past

distinguisher:
  vs: Operation
  rule: an Event announces something that already happened (temporal=past); an Operation performs a change now

edge_participation:
  source_of: [transitions, triggers-cross]
  target_of: [emits, produces]

fixtures:
  positive: spec/__fixtures__/mt/event-ok.md
  negative: spec/__fixtures__/mt/event-bad.md
