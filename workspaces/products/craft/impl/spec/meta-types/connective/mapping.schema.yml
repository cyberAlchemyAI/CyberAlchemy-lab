# DomainSpec v2 meta-type schema — Mapping (Connective). SCHEMA-CONSTITUTION; companion mapping.md.
meta_type: Mapping
category: connective
companion: mapping.md
code_pattern: field-by-field data transformation between two shapes, with a direction

required_structure:
  attributes_table_columns: [Attribute, Value]

criterion:
  has_direction:
    rule: attribute-present
    key: direction

distinguisher:
  vs: Interface
  rule: a Mapping transforms fields between two shapes (has a direction); an Interface is an exposed boundary

edge_participation:
  source_of: [maps]
  target_of: []

fixtures:
  positive: spec/__fixtures__/mt/mapping-ok.md
  negative: spec/__fixtures__/mt/mapping-bad.md
