    delegation_route: task-session
    closure_condition: >
      financial-settlement round-trip stays PASS (missing=0) and byte-stable as the
      engine evolves; it is the proof input for the C2 determinism-by-construction
      claim.
    evidence: ART-TDE-L0-REPORT
    decision_ref: DEC-TDE-INPUT-SCOPE-001
    reason: The passing L0 gate over the full 7-doc input is the load-bearing evidence the engine works.
  - item_id: BLK-TDE-AUTH-CONVENTION-001
    kind: blocker
    base_type: design_blocker
    context_type: tde.oracle_convention_drift
    primary_lane: architecture
    secondary_lanes:
      - validator
    source_id: CTX-TDE-ROOT
    target_id: CTX-TDE-ROOT
    status: resolved
    refinement_status: refined
    default_role: engine_owner
    delegation_route: task-session
    closure_condition: >
      auth-access-control round-trip reaches missing=0 (or documented-irreducible)
      after generalizing semantic-id bridging to handle its dialect (op-qualified
      ids, entity-name drift Session vs SessionLifecycle, row-id-keyed transitions,
      dedicated Error-state category, consumer-bucketed events) WITHOUT hardcoding.
    evidence: ART-TDE-L0-REPORT
    decision_ref: none
    reason: >
      refine 2026-06-21: the failing `column-typed` dialect is the corpus MAJORITY (5/7);
      the passing `rv-ct` dialect is the minority (2/7). Of auth's 30 misses ~16 are
      convention drift (fix via a doc-derived dialect descriptor, no feature-name branches)
      but ~12+ are GENUINE δ gaps — error-obligations and consumer-side events the engine
      derives nothing for. So closing this needs general bridging AND new δ rules, not just
      identity recovery. Delete the hardcoded MAKEUP_CALC_IDS overfit as part of this.
  - item_id: GATE-TDE-CORPUS-GENERALIZATION-001
    kind: gate
    base_type: readiness_gate
    context_type: tde.corpus_generalization
    primary_lane: validator
    secondary_lanes:
      - architecture
    source_id: CTX-TDE-ROOT
    target_id: CTX-TDE-ROOT
    status: resolved
    refinement_status: refined
    default_role: validation_reviewer
    delegation_route: experiment-harness
    closure_condition: >
      The engine round-trips (missing=0 or documented-irreducible) across a declared
      set of >=N poker-team features, not just financial-settlement, before the
      "deterministic derivation" claim generalizes from one feature to the corpus.
    evidence: ART-TDE-WORKPACK
    decision_ref: none
    reason: One passing feature proves feasibility; the C2 claim needs corpus-level evidence (ties to experiments E1a/E2/E3).
  - item_id: BLK-TDE-COMMIT-DISCIPLINE-001
    kind: blocker
    base_type: governance_blocker
    context_type: tde.submodule_commit_discipline
    primary_lane: governance
    secondary_lanes:
      - operator
    source_id: CTX-TDE-ROOT
    target_id: CTX-TDE-ROOT
    status: resolved
    refinement_status: refined
    default_role: operator
    requires_human: true
    delegation_route: task-session
    closure_condition: >
      Engine package + design docs committed in implementation/domainspec; the
      earlier submodule commit pushed and the parent gitlink bumped after
      `make bump-check` (submodule-first, parent-last). Pushing is operator-gated.
    resolution: >
      RESOLVED 2026-06-21. Craft ledger committed ff1eba0 and pushed to origin/main;
      parent gitlink bumped af15e4d after make bump-check passed. development/ (87
      accidentally-deleted files) restored from HEAD.
    evidence: ART-TDE-PACKAGE
    decision_ref: none
    reason: Multiple turns of work are uncommitted; submodule discipline requires push-before-parent-bump, an operator-gated outward action.
  - item_id: BLK-TDE-GATE-HONESTY-001
    kind: blocker
    base_type: validation_blocker
    context_type: tde.round_trip_honesty
    primary_lane: validator
    secondary_lanes:
      - architecture
    source_id: CTX-TDE-ROOT
    target_id: CTX-TDE-ROOT
    status: resolved
    refinement_status: refined
    default_role: validation_reviewer
    delegation_route: task-session
    closure_condition: >
      The round-trip gate is provably falsifiable and injective before any further
      bridging generalization (refine 2026-06-21, P1): (INV-3) a negative control —
      inject a sentinel obligation the engine cannot derive and assert pass===false;
      delete a required engine key and assert it surfaces MISSING — runs in the suite
      and MUST pass before any feature PASS is reported; and (INV-1) WF/QT/MT
      concept-bucketing is split to per-row identity so distinct human obligations
      never collapse to one key. Accept that this temporarily turns the financial
      PASS into honest WF/QT/MT misses.
    evidence: development/refinement-runs/2026-06-21-c2-engine-to-evidence/stages/skeptic-falsification.md
    decision_ref: DEC-TDE-SEMANTIC-RIGOR-001
    reason: >
      The current financial PASS partly depends on non-injective folds; a δ regression
      dropping workflow steps 2–5 would still PASS. Honesty before generalization —
      this lands first (P1) or every later PASS is suspect.

gaps:
  - gap_id: GAP-TDE-EMITTESTS-BODIES-001
    context_id: CTX-TDE-ROOT
    summary: >
      emit_tests renders one runnable `it.todo`/failing case per obligation_key but
      the test BODIES are stubs (expect.fail). Real assertion bodies are needed
      before the emitted suite can drive E3 mutation testing.
      RESOLVED 2026-06-21 (P4) for the deterministically-evaluable subset: hybrid emitter
      (Formal-AST → assertion-from-Formal + seeded property fallback) + bindings.json
      (declares WHICH pure fn, not the answer) emits 11 real bodies (10 assertions + 1
      property) for financial-settlement, all PASS vs real domain code, byte-stable; the
      remaining 56 are honest `it.skip` + coverage_gap (exists/aggregate/makeup-math/
      transitions/contracts/events — need a human oracle, never faked).
    severity: low
    treatment: accept
    owner_route: task-session
    evidence: ART-TDE-L0-REPORT
    status: resolved
  - gap_id: GAP-TDE-PROGRESSION-PROSE-001
    context_id: CTX-TDE-ROOT
    summary: >
      player-progression round-trip has 5 genuine misses: 5 per-assertion calc-scenario prose
      rows over 4 source calcs (makeup-policy-math class, R-C2-5) — prose outside the decidable
      fragment (needs_formal/oracle per the SMT-FOL tower). Honest untuned holdout.
    severity: low
    treatment: accept
    owner_route: domainspec-spec-feature
    evidence: "[repo-root]/research/smt-fol-test-derivation/DISTILLED-KNOWLEDGE.md"
    status: active
  - gap_id: GAP-TDE-POSTCONDITION-IDS-001
    context_id: CTX-TDE-ROOT
    summary: >
      Committed TEST-SPEC PC/WF/QT/MT rows carry no surviving source id, so the
      round-trip bridges them at owning-concept-bucket level, not per-row. Gate
      verifies "covered this operation/workflow" not "covered each specific row".
      Per-row rigor needs the oracle to embed P-/WF-/QT-/MT-ids (upstream authoring fix).
      Bumped low->medium by refine 2026-06-21: WF/QT/MT bucketing is non-injective and
      the financial PASS depends on it (see BLK-TDE-GATE-HONESTY-001 / DEC-TDE-SEMANTIC-RIGOR-001).
    severity: medium
    treatment: defer
    owner_route: domainspec-spec-feature
    evidence: ART-TDE-L0-REPORT
    status: active

  - gap_id: GAP-TDE-E2-NONAUTHOR-USABILITY-001
    context_id: CTX-TDE-ROOT
    summary: >
      E2 requires at least three non-author testers; local author-driven evidence cannot satisfy that usability
      and comprehension boundary.
    severity: medium
    treatment: defer
    owner_route: human study coordinator
    evidence: ART-TDE-WORKPACK
    status: active

  - gap_id: GAP-TDE-SMTFOL-RECOMPOSITION-001
    context_id: CTX-TDE-SMTFOL
    summary: >
      The research tower has a declared TDE recomposition target, but no receipt proves that its decidability
      map has been incorporated into the engine contract. Optional SMT verify/witness integration is excluded
      from this gap and tracked by the parent DomainSpec-v2 EVF context.
    severity: medium
    treatment: defer
    owner_route: engine owner through a bounded recomposition review
    evidence: ART-TDE-SMTFOL-TOWER
    status: active
    links:
      - label: active EVF integration owner
        target: "[repo-root]/projects/domainspec-v2/.craft/ledger.yml"
        kind: path

decisions:
  - decision_id: DEC-TDE-HOME-001
    scope_id: CTX-TDE-ROOT
    question: Where should the TypeScript engine live?
    description: The architecture proposed internal_tools/ but that is a Python tree.
    impact: Affects toolchain, GitNexus indexing, and cross-submodule discipline.
    decision_type: structural
    blocking: false
    status: closed
    selected_option: tools/test-derivation-engine/
    rationale: >
      Matches the existing TS-tooling convention (tools/ holds analyze-signals.ts,
      validate-*.ts, lib/, fixtures/); native TS+vitest; minimal setup.
    evidence: ART-TDE-ARCH
    links:
      - label: resolved via task-session decision-gate
        target: ART-TDE-ARCH
        kind: evidence
  - decision_id: DEC-TDE-LANG-001
    scope_id: CTX-TDE-ROOT
    question: Engine implementation language?
    description: TypeScript vs Python.
    impact: Determines whether emit_tests output is native to the Stryker/vitest E3 target.
    decision_type: structural
    blocking: false
    status: closed
    selected_option: TypeScript
    rationale: Native runnable vitest emission for the E3 mutation target; matches poker-team backend.
    evidence: ART-TDE-ARCH
    links: []
  - decision_id: DEC-TDE-INPUT-SCOPE-001
    scope_id: CTX-TDE-ROOT
    question: Should the engine parse 4 aspect docs or all 7 source docs?
    description: >
      L0 round-trip first FAILED because the committed spec derives from 7 docs
      (adds workflows/queries/mappings) but the engine parsed only the 4 the
      architect scoped.
    impact: Determines whether the engine can reproduce the full human spec (gate PASS).
    decision_type: scope
    blocking: false
    status: closed
    selected_option: Extend to all 7 docs
    rationale: >
      The engine is not a true deterministic replacement until it covers the same
      sources the human derivation used; extending made the gate PASS (missing=0).
    evidence: ART-TDE-L0-REPORT
    links:
      - label: corrected the architect 4-aspect assumption
        target: ART-TDE-ARCH
        kind: related
  - decision_id: DEC-TDE-SEMANTIC-RIGOR-001
    scope_id: CTX-TDE-ROOT
    question: >
      Should the round-trip gate verify per-row obligation identity, or is
      owning-concept-bucket bridging acceptable for PC/WF/QT/MT rows?
    description: >
      Committed PC/WF/QT/MT rows lack surviving source ids, so the gate currently
      compares at concept-bucket level. Per-row rigor would need an upstream oracle
      authoring change (embed ids).
    impact: Determines the strength of the C2 evidence the gate produces.
    decision_type: methodology
    blocking: false
    status: closed
    selected_option: SPLIT — accept op-bucketing for postconditions; reject concept-bucketing for WF/QT/MT
    rationale: >
      Op-bucketing keeps distinct operations distinct (injective enough). Concept-bucketing
      for WF/QT/MT is non-injective (5 workflow steps collapse to 1 key), so it is rejected
      as the permanent answer; require per-row WF/QT/MT ids upstream. Until then the financial
      PASS is caveated as concept-presence-only for those categories. (refine 2026-06-21, Skeptic)
    evidence: ART-TDE-L0-REPORT
    links:
      - label: gap detailing the limitation
        target: GAP-TDE-POSTCONDITION-IDS-001
        kind: related
      - label: refine that resolved this
        target: development/refinement-runs/2026-06-21-c2-engine-to-evidence/RESULT.md
        kind: evidence
  - decision_id: DEC-TDE-DOMAINSPEC-FEATURE-001
    scope_id: CTX-TDE-ROOT
    question: Should the engine be defined/designed as a DomainSpec feature (its own states/operations/interfaces/events), and at what scope/location?
    description: The engine consumes DomainSpec feature docs; specifying it in that format makes it self-derivable.
    impact: Sets the design surface and unlocks (or not) self-derivation as a determinism proof.
    decision_type: methodology
    blocking: false
    status: closed
    selected_option: operations+interfaces scope (honest fit; skip forced states/events) under implementation/domainspec/docs/features/test-derivation-engine/
    rationale: >
      The engine is a stateless pure pipeline; operations + interfaces map cleanly while
      states/events would be over-built (rejected per decision-profile proportionality).
      Locating it in the features tree makes it a first-class DomainSpec feature the engine
      can run on itself (self-derivation fixpoint = strongest C2 proof). Operator decision 2026-06-21.
    evidence: ART-TDE-DSFEATURE
    links:
      - label: invoke define+design via DomainSpec
        target: "[repo-root]/implementation/domainspec/docs/features/test-derivation-engine/SPEC.md"
        kind: evidence

