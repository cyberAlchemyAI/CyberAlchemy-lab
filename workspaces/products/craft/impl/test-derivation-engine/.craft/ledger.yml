contexts:
  - context_id: CTX-TDE-ROOT
    parent_id: root
    title: Deterministic Test-Derivation Engine
    purpose: >
      Build a fully deterministic, no-LLM engine that compiles a feature's
      canonical Markdown docs into byte-stable test obligations (parse -> typed
      graph G -> pure delta -> content-addressed obligation_key -> emit), making
      DomainSpec paper claim C2 (determinism) true by construction and yielding a
      shippable product that replaces the LLM-backed domainspec-generate-tests.
    stage: validate
    gate: flag
    next_move: >
      The original deterministic engine core is complete through P1-P4: the falsifiable/injective gate,
      dialect bridging, corpus generalization and runnable-body emitter are recorded complete. E1a passes and
      E3 ran over 160 mutants with no harness errors; the main quality lever is a value-asserting makeup oracle.
      Remaining: run E2 with at least three non-author testers, resolve the accepted progression-prose and
      postcondition-ID gaps, and recompose the SMT/FOL decidability map without claiming a completed bridge.
      Later BTE and EVF additions in this package are tracked by the parent DomainSpec-v2 Craft contexts and are
      not closed by this legacy engine ledger. No Git action is selected by this refresh.
    owned_artifacts:
      - ART-TDE-PACKAGE
      - ART-TDE-SPEC
      - ART-TDE-ARCH
      - ART-TDE-GLOSSARY
      - ART-TDE-WORKPACK
      - ART-TDE-L0-REPORT
      - ART-TDE-REFINE-RESULT
      - ART-TDE-CRAFT-LEDGER
      - ART-TDE-CRAFT-VIEW
    notes: >
      Root context created by /craft start and relocated to impl/test-derivation-engine/.craft.
      The earlier L0 and auth-failure description is historical; P1-P4 and E3 later superseded that frontier.
  - context_id: CTX-TDE-SMTFOL
    parent_id: CTX-TDE-ROOT
    title: SMT/FOL research tower (engine formal foundation)
    purpose: >
      Preserve the historical research into how SMT solvers + first-order logic ground
      the engine's Formal-cell classes and needs_formal boundary. Its TDE recomposition
      informs δ classification only; operational solver integration belongs to EVF.
    stage: review-audit
    gate: flag
    trigger: operator request 2026-06-21 (/research-tower + bounded web + local harvest)
    expected_artifact: ART-TDE-SMTFOL-TOWER
    recomposition_target: CTX-TDE-ROOT
    next_move: >
      Recompose only the decidability map into the engine as the formal justification
      for the needs_formal boundary (P1/P4). Preserve the opt-in SMT verify/witness
      proposal as source evidence for the parent DomainSpec-v2 EVF provider-integration
      gap; do not implement or close that operational frontier in this legacy engine ledger.
    notes: >
      Local-research-only. Convergent finding: the 4 Formal classes are decidable QF
      fragments (formalizable); determinism is binding; needs_formal is theory-mandated.
      Provenance stays here even though current solver-backed validation ownership is EVF.

descriptions:
  - description_id: DESC-TDE-001
    context_id: CTX-TDE-ROOT
    description: >
      Status as of 2026-06-15. The engine (TypeScript, tools/test-derivation-engine)
      parses the 7 financial-settlement aspect docs into a typed concept graph,
      applies pure delta rules with EXACT cardinalities, stamps content-addressed
      obligation_keys, and emits TEST-SPEC + runnable vitest. L0 gate: financial
      round-trip reproduces 100% of committed obligations (missing=0) with 16
      legitimate completeness extras, byte-identical across runs. Auth-access-control
      parses (108 obligations, 0 violations) but its round-trip FAILs (30 missing /
      25 extra) due to a different oracle dialect, not delta defects.
    status: superseded
    evidence: ART-TDE-L0-REPORT

  - description_id: DESC-TDE-002
    context_id: CTX-TDE-ROOT
    description: >
      Status refreshed 2026-08-24. The original engine is beyond the pre-P1 L0 snapshot: P1-P4, E1a and E3
      are recorded complete at their local evidence ceilings. E2 remains human-dependent, the makeup oracle
      remains the main mutation-quality lever, and SMT/FOL recomposition remains pending. New BTE/EVF code in
      the package belongs to parent DomainSpec-v2 contexts.
    status: active
    evidence: ART-TDE-L0-REPORT

definitions:
  - definition_id: DEF-TDE-ENGINE-001
    scope_id: CTX-TDE-ROOT
    term: deterministic test-derivation engine
    statement: >
      A pure, no-LLM, no-network pipeline (parse -> G -> delta -> obligation_key ->
      emit) that compiles canonical feature docs into byte-stable test obligations,
      so determinism is true by construction rather than measured on a stochastic
      generator.
    status: candidate
    evidence: ART-TDE-SPEC
  - definition_id: DEF-TDE-OBLIGATION-KEY-001
    scope_id: CTX-TDE-ROOT
    term: obligation_key
    statement: >
      sha1(source_anchor | rule_type | canonical_params) — a content-addressed,
      order-invariant, byte-stable identifier for a derived obligation. Gives
      cross-run determinism structurally and dissolves the original E1 "Jaccard over
      hand-numbered IDs" problem.
    status: candidate
    evidence: ART-TDE-GLOSSARY
  - definition_id: DEF-TDE-SEMANTIC-ROUNDTRIP-001
    scope_id: CTX-TDE-ROOT
    term: semantic round-trip identity
    statement: >
      A normalized identity (`normRuleType:tokens`) that BOTH the engine output and
      the committed TEST-SPEC map into, since their raw ID schemes differ. The L0
      gate asks "did the engine cover every source obligation the human catalogued?"
      (engine-set superset of committed-set) at this level, not per-micro-case.
    status: candidate
    evidence: ART-TDE-L0-REPORT
  - definition_id: DEF-TDE-NEEDS-FORMAL-001
    scope_id: CTX-TDE-ROOT
    term: needs_formal
    statement: >
      The deterministic escape hatch: a Formal cell that is prose the sub-grammar
      cannot classify is flagged needs_formal (counted, surfaced by the linter),
      never guessed. Keeps the engine deterministic about what it cannot formalize.
    status: candidate
    evidence: ART-TDE-L0-REPORT

typed_items:
  - item_id: ENA-TDE-L0-PASS-001
    kind: enabler
