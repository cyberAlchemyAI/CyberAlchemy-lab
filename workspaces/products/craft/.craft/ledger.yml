  - decision_id: DEC-DSV2-SPEC-HOMING
    scope_id: CTX-DSV2-REFORMULATE-BATCH1
    question: Should all impl/spec/*.md governance docs be removed and consumed from root definitions/?
    options: [all-to-root, no-hand-projections-route-to-owner, keep-hand-projections]
    decision_type: architecture
    blocking: false
    status: closed
    default_option: no-hand-projections-route-to-owner
    selected_option: no-hand-projections-route-to-owner
    description: >-
      Proposal: delete every impl/spec/*.md and have all consumers read root. Investigation: only 2 of the 6
      top-level docs (TAXONOMY, RELATIONSHIPS) are machine-consumed (validate-code-tags); the engine reads
      none of them; AXIOMS/DRIFT/TEST-PIPELINE have no root home and no consumer.
    impact: >-
      Re-scopes batch-1 from "reformulate 6 docs in place" to "root is the sole authored authority; no
      hand-authored projections; governance prose routes to its owner surface."
    rationale: >-
      Dialectic 2026-07-06. Thesis: single authority removes the projection-drift failure mode behind the R3A
      orphan. Antithesis: the two-plane boundary (DEF-DSV2-TWO-PLANE) is deliberate; 4 of 6 docs are prose with
      no consumer; forcing AXIOMS into definitions/ violates the project's own orthogonality rule
      (domainspec-v2-D3/CAV2-D22 — a proposition is not a term). Synthesis: the real invariant is "no
      HAND-authored projections", not "no projections" — any impl/spec view is generated from root and
