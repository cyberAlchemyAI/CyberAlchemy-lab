  - decision_id: DEC-DSV2-EDGE-ADMISSIBILITY
    scope_id: CTX-DSV2-REFORMULATE-BATCH1
    question: What governs whether a RELATIONSHIPS edge earns its own type, vs folding into a node type or a coupling flag?
    options: [ad-hoc, build-from-owned-cav2-orthogonality]
    decision_type: edge-law
    blocking: false
    status: closed
    selected_option: build-from-owned-cav2-orthogonality
    rationale: >-
      The edge-law admissibility test ("an edge earns its type iff it composes into different code") is a
      domain specialization of owned cav2 invariants — CAV2-D22 (orthogonal classification), CAV2-D29
      (axis orthogonality), CAV2-D16 (typed coupling). Rulings: keep enforces vs applies (guard vs
      select); collapse enforces/enforces-cross to one edge + a cross-feature flag; reject queries for
      Calculation->Policy (redundant with applies); widen applies to Policy->{Operation, Calculation}.
      Scope = governance orthogonality, NOT Lean/Hilbert projector orthogonality (excluded from cav2).
    evidence: [ART-DSV2-REFORMULATE-BATCH1, ART-DSV2-SPEC-ONTOLOGY-TOY]
