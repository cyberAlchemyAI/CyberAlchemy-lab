definitions:
  - definition_id: DEF-DSV2-TWO-PLANE
    context_id: CTX-DSV2-SPEC-ONTOLOGY
    term: two-plane boundary
    meaning: >-
      Ontology framing wins on the spec-AUTHORING plane; derivation stays primary on the engine-facing
      CONTRACT plane; authority flows contract -> authoring, never reverse.
    status: candidate
    evidence: [ART-DSV2-SPEC-ONTOLOGY-RESEARCH]

  - definition_id: DEF-DSV2-EXEC-GRAPH
    context_id: CTX-DSV2-ROOT
    term: executable typed graph
    meaning: >-
      The v2 spec as taxonomy (nodes) + edges (edge-law) + composability (how node-patterns compose in
      code), governed by layering / validation / drift with two enforcement arms (engine derivation + code-tag).
    status: candidate
    evidence: [ART-DSV2-COMPOSABILITY-SYNTHESIS]

  - definition_id: DEF-DSV2-EDGE-ADMISSIBILITY
    context_id: CTX-DSV2-REFORMULATE-BATCH1
    term: edge-law admissibility
    meaning: >-
      An edge type is admissible only if it composes into different code (adds a non-redundant
      distinction); otherwise the distinction folds into the node type or an explicit typed coupling
      flag. A domain specialization of CAV2-D22 / D29 / D16 (governance orthogonality, not Lean/Hilbert).
    status: candidate
    evidence: [ART-DSV2-REFORMULATE-BATCH1]

  - definition_id: FPR-D01
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: BO
    meaning: Finite governed business concept, relation, rule, and constraint schema with stable IDs, provenance, and contradiction policy.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D02
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: BK
    meaning: Profile-scoped asserted business nodes, edges, rules, and constraints instantiating BO; not a synonym for ontology.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D03
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: B
    meaning: Contract business plane composed of BO, BK, provenance, and an authority receipt.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D04
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: Spec
    meaning: Owner-promoted authoritative DomainSpec definitions, registries, and selected feature-pack sources.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D05
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: Sg
    meaning: Deterministic total typed projection normalize(Spec,P) with source anchors; never parallel semantic authority.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D06
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: G
    meaning: Internal compiler IR produced by encoding Sg; not a contract semantic plane.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D07
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: A_req
    meaning: Normative architecture requirements graph with finite layers, admissibility, forbidden dependencies, patterns, and path obligations; no observed imports or calls.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D08
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: F_struct
    meaning: Bounded relational structural projection with source map, abstraction, solver, bounds, timeout, and result taxonomy.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D09
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: F_state
    meaning: Bounded state/transition projection for reachability, invariants, deadlock, and declared liveness or fairness.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D10
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: O_spec(P)
    meaning: Independent authority-owned expected obligation set for the exact supported profile P.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D11
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: Expected(o)
    meaning: Expected predicate or value rooted in promoted Spec, possibly referencing accepted B; never inferred from tests or implementation output.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D12
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: Req_spec(o)
    meaning: Closed set of required evidence classes and expected outcomes for obligation o.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D13
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: T_gen
    meaning: Generated executable verification program or artifact; neither execution evidence nor its own oracle.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D14
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: E_run
    meaning: Candidate, profile, and tool-bound static, formal, execution, and mutation receipts; evidence rather than authority.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D15
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: I_struct
    meaning: Observation graph over frozen code roots under pinned parser/tool semantics; tags are correspondence claims.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D16
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: cross_graph_conformance_vector
    meaning: Machine vector of named directional predicates; contract and internal-assurance predicates remain segregated and owner judgment cannot set a pass bit.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D17
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: profile/structural conformance verdict
    meaning: Machine result that required sources satisfy the frozen profile and structural rules; it does not accept implementation or authorize release.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D18
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: mapping-predicate verdict
    meaning: Machine result for one named directional predicate under explicit bounds, algorithm version, and result taxonomy.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D19
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: implementation-conformance acceptance
    meaning: Implementation/platform-owner decision made only after all applicable technical predicates and evidence pass.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D20
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: release authorization
    meaning: External-owner authorization of exact bits, claims, actors, channel, compatibility, support, and withdrawal after independent verification.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D21
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: node-ready
    meaning: One named roadmap node has closed dependencies, present inputs, assigned execution owner, and no inbound block.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D22
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: roadmap-ready-for-execution
    meaning: Every first executable node is node-ready, candidate definitions are tracked, and the Craft expected-state manifest is instantiated and validated.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D23
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: release-ready
    meaning: Every contract-required pre-release node and gate has passed for one exact candidate.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]
  - definition_id: FPR-D24
    context_id: CTX-DSV2-FIRST-PRODUCTION-RELEASE
    term: production-authorized
    meaning: Release authorization exists for one exact artifact and configuration under named actors, environment, compatibility, support, and withdrawal boundaries.
    status: candidate
    evidence: [ART-DSV2-FPR-FINDINGS]

