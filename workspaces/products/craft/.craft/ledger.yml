  - decision_id: DEC-B1-SATURN-AXIOM-SCOPE
    scope_id: CTX-DSV2-REFORMULATE-BATCH1
    question: Which v1 axioms/constitution rules belong in DomainSpec-v2 vs the Saturn (loop) pillar?
    options: [scope-down-to-saturn, keep-all-self-contained, drop-hard]
    decision_type: pillar-boundary
    blocking: true
    status: closed
    selected_option: scope-down-to-saturn
    description: >-
      v1's AXIOMS (A1-A6) + CONSTITUTION (C1-C11) carry observability/loop material (A4 observer/executor,
      A5 shift-left/reflection, A6 feedback budget; C3 signal schema, C4 dual observer, C9 telemetry, C11
      metrics/reflect) that architecturally belongs to Saturn (the loop closing intent<->reality), not
      DomainSpec (the *what*/typed intent). Gates R1 (AXIOMS) and R6a/R6b (CONSTITUTION crosswalk).
    impact: >-
      Decides the content of R1 + R6a/R6b and pre-decides most of the R6a crosswalk. Saturn isn't a folder yet
      (spec/private), so Saturn-owned material is DROP-with-pointer until the Saturn spine exists.
    rationale: >-
      Owner decision via decision-gate 2026-07-06 (recommended option). Three-pillar model: Saturn owns the
      observability/reflection loop. Per-rule cut —
      STAY in DomainSpec-v2: A1 (semantic authority), A2 (adapter line), A3 (RECAST: governance methods must be
      runnable/computable); C1 (spec=source-of-truth / base), C2 (no domain logic in adapters / layering),
      C5 (critical violations block merge / validation-shift-left), C6 (code<->concept anchors / layering),
      C7 (alignment+layering audits / layering-drift), C8 (deterministic detectors / validation — underpins the engine).
      ROUTE to Saturn (DROP-with-pointer): A4 (observer/executor), A6 (feedback budget); C3 (signal schema),
      C4 (dual observer), C9 (telemetry), C11 (metrics/reflect).
      STRADDLERS (R6a resolves with this default): A5 — keep the shift-left half (realized as C5), route the
      reflection-outer-loop half to Saturn; C10 (prune-by-evidence / via-negativa) — keep as DomainSpec drift
      governance; its feedback-budget cadence references Saturn A6.
    evidence:
      - {label: v1 axioms (read 2026-07-06), target: "[repo-root]/projects/domainspec-v2/impl/spec/AXIOMS.md", kind: path}
      - {label: v1 constitution, target: "[repo-root]/projects/domainspec-v2/impl/spec/CONSTITUTION.md", kind: path}
