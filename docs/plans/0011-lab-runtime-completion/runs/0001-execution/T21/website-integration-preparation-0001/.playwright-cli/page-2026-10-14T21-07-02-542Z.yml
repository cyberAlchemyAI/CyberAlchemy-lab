    - article [ref=f1e84]:
      - generic [ref=f1e85]:
        - paragraph [ref=f1e86]: Lab runtime · proposed documentation
        - heading "Operate the Lab" [level=1] [ref=f1e87]
        - paragraph [ref=f1e88]: Choose the implementation and the next task before relying on a runtime result.
        - paragraph [ref=f1e89]: Draft prepared on 2026-10-14. Integration and final T21 qualification remain pending.
      - region [ref=f1e90]:
        - heading "Start with the admitted inspection path" [level=2] [ref=f1e91]
        - paragraph [ref=f1e92]:
          - text: For a
          - link "first inspection" [ref=f1e93] [cursor=pointer]:
            - /url: runtime-first-inspection.html
          - text: ", use the admitted local v1 executable and its frozen Decision 0074 source profile. Decision 0075 admits that exact executable for local inspection, authorized local transactions, replay/recovery and ephemeral context. The admission is an external overlay: its original README can still say candidate without undoing the later decision. Read the"
          - link "admission scope" [ref=f1e94] [cursor=pointer]:
            - /url: research/sources/runtime/runtime-doc2/implementation/lab-runtime/ADMISSION.md
          - text: ", then follow first inspection ."
        - paragraph [ref=f1e95]: The three-command walkthrough checks public source files and selects a deliberately nonexistent store. It creates no store, key or transaction. Its observed output is D74 with 698 verified sources and 468 subjects. This is a useful working entrypoint; it is separate from a permanent service, a new installation and the expanded API.
