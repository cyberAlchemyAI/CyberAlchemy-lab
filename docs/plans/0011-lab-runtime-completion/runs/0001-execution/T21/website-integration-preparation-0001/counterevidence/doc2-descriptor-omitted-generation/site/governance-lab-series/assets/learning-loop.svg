<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" role="img" aria-labelledby="learning-loop-title learning-loop-desc"><title id="learning-loop-title">Experience, later lesson use and assessment</title><desc id="learning-loop-desc">Read three stages in order: record the incident investigation through an Operational Observation, propose advice for future work where data can change between batches, then record its use or deliberate non-use and assess the predicted benefit. That advice does not establish the cause or remedy of the fixed-snapshot Northstar incident. The SVG label Work observation refers to the Operational Observation record kind.</desc><style>svg{
  color-scheme: light;
  --ds-canvas: #fdfaf3;
  --ds-surface: #fffdf8;
  --ds-subtle: #f3eee4;
  --ds-ink: #151515;
  --ds-muted: #625e57;
  --ds-border: #d8d1c4;
  --ds-control-border: #8a8276;
  --ds-accent: #bd1230;
  --ds-accent-hover: #991022;
  --ds-success: #246440;
  --ds-warning: #82520a;
  --ds-danger: #a51d2d;
  --ds-focus: #245eb0;
  --ds-font-ui: "Helvetica Neue", Arial, ui-sans-serif, system-ui, sans-serif;
  --ds-font-display: "Iowan Old Style", Baskerville, "Times New Roman", ui-serif, serif;
  --ds-font-code: ui-monospace, "Cascadia Code", monospace;
  --ds-text-meta: .75rem;
  --ds-text-label: .875rem;
  --ds-text-body: 1rem;
  --ds-text-lead: 1.125rem;
  --ds-space-1: .25rem;
  --ds-space-2: .5rem;
  --ds-space-3: .75rem;
  --ds-space-4: 1rem;
  --ds-space-6: 1.5rem;
  --ds-space-8: 2rem;
  --ds-space-12: 3rem;
  --ds-space-16: 4rem;
  --ds-radius: .25rem;
  --ds-control-height: 2.75rem;
  --ds-measure: 44rem;
  --ds-page-width: 76rem;
  --ds-motion: 140ms;
  /* Compatibility names for existing layouts and protocol diagrams. */
  --ink: var(--ds-ink); --text: var(--ds-ink); --black: #050505;
  --shell: #20252a; --paper: var(--ds-canvas); --surface: var(--ds-surface);
  --paper-soft: var(--ds-subtle); --line: var(--ds-border);
  --muted: var(--ds-muted); --dim: var(--ds-muted);
  --red: var(--ds-accent); --red-deep: var(--ds-accent-hover);
  --orange: #b94812; --amber: #f0a43c; --teal: #087773;
  --green: var(--ds-success); --blue: var(--ds-focus); --violet: #5c55b8;
  --mint: var(--ds-accent); --danger: var(--ds-danger);
  --shadow: 0 18px 60px rgb(21 21 21 / 12%);
  --shadow-soft: 0 10px 32px rgb(21 21 21 / 7%);
  --font-ui: var(--ds-font-ui); --font-display: var(--ds-font-display);
  font-family: var(--ds-font-ui);
}text{font-family:var(--ds-font-ui);fill:var(--ds-ink)}.node{fill:var(--ds-surface);stroke:var(--ds-border);stroke-width:1.4}.teal{fill:var(--ds-subtle);stroke:var(--ds-accent)}.blue{fill:var(--ds-canvas);stroke:var(--ds-focus)}.ochre{fill:var(--ds-subtle);stroke:var(--ds-warning)}.boundary{fill:none;stroke:var(--ds-control-border);stroke-width:1.4}.teal-boundary{fill:var(--ds-subtle);stroke:var(--ds-accent)}.blue-boundary{fill:var(--ds-subtle);stroke:var(--ds-focus)}.ochre-boundary{fill:var(--ds-subtle);stroke:var(--ds-warning)}.session-boundary{fill:var(--ds-canvas);stroke:var(--ds-control-border);stroke-dasharray:7 5}.connector{fill:none;stroke:var(--ds-muted);stroke-width:1.65}.dashed{stroke-dasharray:5 4}.node-title{font-size:20px;font-weight:600}.node-sub{font-size:16px;fill:var(--ds-muted)}.small-label{font-size:15px;font-weight:600;fill:var(--ds-muted)}.edge-label{font-size:16px;fill:var(--ds-muted)}@media(forced-colors:active){svg{--ds-ink:CanvasText;--ds-muted:CanvasText;--ds-canvas:Canvas;--ds-surface:Canvas;--ds-subtle:Canvas;--ds-border:ButtonBorder;--ds-control-border:ButtonBorder;--ds-accent:LinkText;--ds-focus:Highlight;--ds-warning:CanvasText}}/* Generated from lab_visual_language.py. */
svg{--lab-model-intent:#805616;--lab-model-product:#31547a;--lab-model-project:#23665f;--lab-model-work:#b94812;--lab-model-agent:#5c55b8;}
[data-theme="console"]{--lab-model-intent:#d5b072;--lab-model-product:#9ab9e4;--lab-model-project:#85c3b6;--lab-model-work:#eaa176;--lab-model-agent:#bcb4ff;}
[data-model-concept="intent"]{ --model-color:var(--lab-model-intent); --smap-color:var(--lab-model-intent); }
[data-model-concept="product"]{ --model-color:var(--lab-model-product); --smap-color:var(--lab-model-product); }
[data-model-concept="project"]{ --model-color:var(--lab-model-project); --smap-color:var(--lab-model-project); }
[data-model-concept="work"]{ --model-color:var(--lab-model-work); --smap-color:var(--lab-model-work); }
[data-model-concept="agent"]{ --model-color:var(--lab-model-agent); --smap-color:var(--lab-model-agent); }
.lab-icon, .diagram svg.lab-icon { display:block; width:1.375rem; height:1.375rem; min-width:0; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.model-heading { display:flex; align-items:center; gap:.75rem; }
.model-heading > .lab-icon { color:var(--model-color); }
.model-heading > span { min-width:0; }
.model-svg-node > rect, .model-svg-project > rect { fill:color-mix(in srgb,var(--model-color) 7%,var(--ds-surface)); stroke:var(--model-color); }
.model-svg-node > .node-title, .model-svg-project > .node-title { fill:var(--model-color); }
.model-svg-node > .model-svg-small-title { font-size:15px; }
.model-svg-icon { color:var(--model-color); fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.model-svg-session > .session-boundary { fill:color-mix(in srgb,var(--model-color) 4%,var(--ds-surface)); stroke:var(--model-color); }
.model-svg-session > .small-label { fill:var(--model-color); }
@media(forced-colors:active) {
  [data-model-concept] { --model-color:CanvasText; --smap-color:CanvasText; }
  .model-svg-node > rect, .model-svg-project > rect, .model-svg-session > .session-boundary { fill:Canvas; stroke:CanvasText; }
}
</style><defs><marker id="learning-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ds-muted)"/></marker></defs><text x="30" y="35" class="small-label" text-anchor="start"><tspan x="30" dy="0">01 · RECORD WHAT HAPPENED</tspan></text><rect x="30" y="60" width="180" height="100" rx="4" class="node normal" /><text x="120.0" y="94" class="node-title" text-anchor="middle"><tspan x="120.0" dy="0">Work</tspan></text><text x="120.0" y="120" class="node-sub" text-anchor="middle"><tspan x="120.0" dy="0">Investigate incident</tspan></text><rect x="270" y="60" width="180" height="100" rx="4" class="node normal" /><text x="360.0" y="94" class="node-title" text-anchor="middle"><tspan x="360.0" dy="0">Work observation</tspan></text><text x="360.0" y="120" class="node-sub" text-anchor="middle"><tspan x="360.0" dy="0">Required rows missing</tspan></text><rect x="510" y="60" width="180" height="100" rx="4" class="node normal" /><text x="600.0" y="94" class="node-title" text-anchor="middle"><tspan x="600.0" dy="0">Reflection</tspan></text><text x="600.0" y="120" class="node-sub" text-anchor="middle"><tspan x="600.0" dy="0">Inspect adjacent batches</tspan></text><g class="diagram-connection"><path d="M212,110 L268,110" class="connector " marker-end="url(#learning-loop-arrow)" /></g><g class="diagram-connection"><path d="M452,110 L508,110" class="connector " marker-end="url(#learning-loop-arrow)" /></g><text x="30" y="212" class="small-label" text-anchor="start"><tspan x="30" dy="0">02 · PROPOSE A LESSON</tspan></text><rect x="30" y="238" width="660" height="178" rx="4" class="node teal" /><text x="360.0" y="272" class="node-title" text-anchor="middle"><tspan x="360.0" dy="0">Proposed lesson · compare adjacent batches</tspan></text><text x="52" y="306" class="node-sub" text-anchor="start"><tspan x="52" dy="0">Evidence: recorded failed run and row comparison. </tspan><tspan x="52" dy="22">Applies when data can change between batch requests. </tspan><tspan x="52" dy="22">Excludes fixed-data exports with a different integrity contract. </tspan><tspan x="52" dy="22">Predicted benefit: detect missing rows before delivery. </tspan><tspan x="52" dy="22">Contradicted if a checked export still delivers missing rows.</tspan></text><text x="30" y="466" class="small-label" text-anchor="start"><tspan x="30" dy="0">03 · EXAMINE LATER USE</tspan></text><rect x="30" y="490" width="290" height="122" rx="4" class="node normal" /><text x="175.0" y="524" class="node-title" text-anchor="middle"><tspan x="175.0" dy="0">Lesson application</tspan></text><text x="175.0" y="550" class="node-sub" text-anchor="middle"><tspan x="175.0" dy="0">Name the lesson version. </tspan><tspan x="175.0" dy="21">Record use or deliberate non-use.</tspan></text><rect x="400" y="490" width="290" height="122" rx="4" class="node blue" /><text x="545.0" y="524" class="node-title" text-anchor="middle"><tspan x="545.0" dy="0">Outcome assessment</tspan></text><text x="545.0" y="550" class="node-sub" text-anchor="middle"><tspan x="545.0" dy="0">Compare the prediction with </tspan><tspan x="545.0" dy="21">the observed result and evidence.</tspan></text><g class="diagram-connection"><path d="M322,551 L398,551" class="connector " marker-end="url(#learning-loop-arrow)" /></g><text x="360" y="658" class="edge-label" text-anchor="middle"><tspan x="360" dy="0">Changing rules or code requires its own authorization.</tspan></text></svg>