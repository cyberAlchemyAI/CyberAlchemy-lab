<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
<title id="title">From domain meaning to compiled artifacts and recorded observations</title><desc id="desc">Domain definitions inform a project model. Validation checks its declarations under selected architecture constraints. The compiler uses selected realizations to construct artifacts. Observations of exact targets and records of performed work are preserved in project state.</desc>
