 y="198.0" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">Model validation</text><text x="530.0" y="220.0" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">Checks selected</text><text x="530.0" y="242.0" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">inputs</text></g><g><rect x="680" y="165" width="180" height="100" rx="7" fill="#fff3e9" stroke="#c68455" stroke-width="1.5"/><text x="770.0" y="220.0" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">Compiler</text></g><g><rect x="440" y="20" width="180" height="100" rx="7" fill="#eef4fb" stroke="#6488b6" stroke-width="1.5"/><text x="530.0" y="42.0" text-anchor="middle" fill="#17395f" font-size="16" font-weight="600">Architecture</text><text x="530.0" y="64.0" text-anchor="middle" fill="#17395f" font-size="16" font-weight="600">profile</text><text x="530.0" y="86.0" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">Composition</text><text x="530.0" y="108.0" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">constraints</text></g><g><rect x="680" y="20" width="180" height="100" rx="7" fill="#fff3e9" stroke="#c68455" stroke-width="1.5"/><text x="770.0" y="53.0" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">Selected</text><text x="770.0" y="75.0" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">realizations</text><text x="770.0" y="97.0" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">Implementation forms</text></g><g><rect x="660" y="360" width="200" height="125" rx="7" fill="#f7f4ed" stroke="#a49b8c" stroke-width="1.5"/><text x="760.0" y="394.5" text-anchor="middle" fill="#242322" font-size="16" font-weight="600">Source-code</text><text x="760.0" y="416.5" text-anchor="middle" fill="#242322" font-size="16" font-weight="600">artifacts</text><text x="760.0" y="438.5" text-anchor="middle" fill="#242322" font-size="15" font-weight="400">Bind