<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="title desc">
<title id="title">How local shortcuts accumulate design debt</title><desc id="desc">A new request leads to a convenient patch, duplicated or entangled responsibilities, harder subsequent changes and pressure for another local workaround.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#817a70"/></marker></defs>
<rect width="100%" height="100%" fill="#fffdf8"/>
<g font-family="Helvetica Neue, Arial, sans-serif"><path d="M 195,95 L 240,95" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 415,95 L 460,95" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 635,95 L 680,95" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 770,145 L 770,263 L 715,263" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 455,263 L 328,263 L 328,145" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="20" y="45" width="175" height="100" rx="7" fill="#fff3e9" stroke="#c68455" stroke-width="1.5"/><text x="107.5" y="100.0" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">New request</text></g><g><rect x="240" y="45" width="175" height="100" rx="7" fill="#fff3e9" stroke="#c68455" stroke-width="1.5"/><text x="327.5" y="89.0" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">Convenient local</text><text x="327.5" y="111.0" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">patch</text></g><g><rect x="460" y="45" width="175" height="100" rx="7" fill="#fff0f0" stroke="#bd7d87" stroke-width="1.5"/><text x="547.5" y="78.0" text-anchor="middle" fill="#7d2435" font-size="16" font-weight="600">Copied rules</text><text x="547.5" y="100.0" text-anchor="middle" fill="#7d2435" font-size="15" font-weight="400">or entangled</text><text x="547.5" y="122.0" text-anchor="middle" fill="#7d2435" font-size="15" font-weight="400">responsibilities</text></g><g><rect x="680" y="45" width="180" height="100" rx="7" fill="#fff0f0" stroke="#bd7d87" stroke-width="1.5"/><text x="770.0" y="67.0" text-anchor="middle" fill="#7d2435" font-size="16" font-weight="600">Harder next</text><text x="770.0" y="89.0" text-anchor="middle" fill="#7d2435" font-size="16" font-weight="600">change</text><text x="770.0" y="111.0" text-anchor="middle" fill="#7d2435" font-size="15" font-weight="400">More investigation</text><text x="770.0" y="133.0" text-anchor="middle" fill="#7d2435" font-size="15" font-weight="400">and coordination</text></g><g><rect x="455" y="220" width="260" height="85" rx="7" fill="#fff0f0" stroke="#bd7d87" stroke-width="1.5"/><text x="585.0" y="256.5" text-anchor="middle" fill="#7d2435" font-size="16" font-weight="600">Pressure for another</text><text x="585.0" y="278.5" text-anchor="middle" fill="#7d2435" font-size="16" font-weight="600">workaround</text></g></g></svg>