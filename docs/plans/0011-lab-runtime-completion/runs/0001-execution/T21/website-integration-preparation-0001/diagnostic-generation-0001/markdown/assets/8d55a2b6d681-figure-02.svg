" y="280.5" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">Policy · Workflow</text></g><g><rect x="460" y="155" width="180" height="175" rx="7" fill="#f5f0fa" stroke="#9c83b5" stroke-width="1.5"/><text x="550.0" y="214.5" text-anchor="middle" fill="#4e366b" font-size="16" font-weight="600">Connective</text><text x="550.0" y="236.5" text-anchor="middle" fill="#4e366b" font-size="15" font-weight="400">Interface</text><text x="550.0" y="258.5" text-anchor="middle" fill="#4e366b" font-size="15" font-weight="400">Event</text><text x="550.0" y="280.5" text-anchor="middle" fill="#4e366b" font-size="15" font-weight="400">Mapping</text></g><g><rect x="680" y="155" width="180" height="175" rx="7" fill="#edf6ef" stroke="#77a585" stroke-width="1.5"/><text x="770.0" y="236.5" text-anchor="middle" fill="#235439" font-size="16" font-weight="600">Lifecycle</text><text x="770.0" y="258.5" text-anchor="middle" fill="#235439" font-size="15" font-weight="400">State Machine</text></g></g></svg>