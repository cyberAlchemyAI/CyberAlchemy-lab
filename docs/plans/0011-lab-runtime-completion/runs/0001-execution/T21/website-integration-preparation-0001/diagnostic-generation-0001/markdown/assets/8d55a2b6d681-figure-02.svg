<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-labelledby="title desc">
<title id="title">The four families of active backend roles</title><desc id="desc">Structural roles are Entity, Value Object and Enum. Behavioral roles are Operation, Query, Calculation, Rule, Policy and Workflow. Connective roles are Interface, Event and Mapping. The lifecycle role is State Machine.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#817a70"/></marker></defs>
<rect width="100%" height="100%" fill="#fffdf8"/>
