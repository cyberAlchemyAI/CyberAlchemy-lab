text-anchor="middle"><tspan x="185" dy="0">Meaning</tspan></text><text x="500" y="233" class="small-label" text-anchor="middle"><tspan x="500" dy="0">Required format</tspan></text><text x="815" y="233" class="small-label" text-anchor="middle"><tspan x="815" dy="0">This investigation</tspan></text></svg>