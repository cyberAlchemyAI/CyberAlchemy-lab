<svg xmlns="http://www.w3.org/2000/svg" width="880" height="395" viewBox="0 0 880 395" role="img" aria-labelledby="title desc">
<title id="title">Authority, provenance and lifecycle are three lenses on the same subject</title><desc id="desc">A particular definition, model, artifact or work record can be examined for its governing meaning and permissions, its origin and evidence, and its current state and required transitions. These are independent governance questions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#817a70"/></marker></defs>
<rect width="100%" height="100%" fill="#fffdf8"/>
<g font-family="Helvetica Neue, Arial, sans-serif"><path d="M 440,120 L 440,165 L 145,165 L 145,215" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 440,120 L 440,165 L 440,165 L 440,215" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 440,120 L 440,165 L 735,165 L 735,215" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="240" y="20" width="400" height="100" rx="7" fill="#f7f4ed" stroke="#a49b8c" stroke-width="1.5"/><text x="440.0" y="64.0" text-anchor="middle" fill="#242322" font-size="16" font-weight="600">A particular subject and version</text><text x="440.0" y="86.0" text-anchor="middle" fill="#242322" font-size="15" font-weight="400">Definition, model, artifact or work record</text></g><g><rect x="20" y="215" width="250" height="150" rx="7" fill="#fff3e9" stroke="#c68455" stroke-width="1.5"/><text x="145.0" y="273.0" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">Authority</text><text x="145.0" y="295.0" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">Governing meanings and rules</text><text x="145.0" y="317.0" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">Permissions and scope</text></g><g><rect x="315" y="215" width="250" height="150" rx="7" fill="#f5f0fa" stroke="#9c83b5" stroke-width="1.5"/><text x="440.0" y="273.0" text-anchor="middle" fill="#4e366b" font-size="16" font-weight="600">Provenance</text><text x="440.0" y="295.0" text-anchor="middle" fill="#4e366b" font-size="15" font-weight="400">Inputs and producing actions</text><text x="440.0" y="317.0" text-anchor="middle" fill="#4e366b" font-size="15" font-weight="400">Relevant observations</text></g><g><rect x="610" y="215" width="250" height="150" rx="7" fill="#edf6ef" stroke="#77a585" stroke-width="1.5"/><text x="735.0" y="273.0" text-anchor="middle" fill="#235439" font-size="16" font-weight="600">Lifecycle</text><text x="735.0" y="295.0" text-anchor="middle" fill="#235439" font-size="15" font-weight="400">Current state</text><text x="735.0" y="317.0" text-anchor="middle" fill="#235439" font-size="15" font-weight="400">Permitted transitions</text></g></g></svg>