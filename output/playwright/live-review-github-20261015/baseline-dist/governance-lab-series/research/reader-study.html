<html data-site-design="paper" lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documentation reader study</title>
<style>body{font:1rem/1.8 system-ui,sans-serif;color:#172c42;max-width:48rem;margin:3rem auto;padding:0 1.4rem}h1,h2{line-height:1.3}fieldset{border:0;border-top:1px solid #b8c5d1;margin:2.5rem 0;padding:1.5rem 0}legend{font-weight:700;font-size:1.2rem;padding:0 .5rem 0 0}label{display:block;margin:1rem 0 .3rem}textarea,input,select,button{font:inherit;box-sizing:border-box;width:100%;padding:.6rem;border:1px solid #708598;border-radius:0;background:#fff;color:inherit}textarea{min-height:7rem}button{cursor:pointer;background:#194d7b;color:white;margin-top:1.5rem}:focus-visible{outline:3px solid #b96817;outline-offset:3px}a{color:#194d7b}.small{font-size:.9rem}p{margin:1.1rem 0}</style><link rel="icon" type="image/svg+xml" href="../assets/paper-crimson/favicon.svg?v=8bba035c9748">

<body class="site-document site-standalone"><header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><img src="../assets/paper-crimson/logo.svg" alt="CyberAlchemy Lab" width="176" height="41"></a><nav aria-label="Main navigation"><a href="../index.html">The Lab</a><a href="../start-here.html">Guide</a></nav></div></header><main id="reader-study"><h1>Try the Lab documentation</h1><p>Use <a href="../start-here.html" target="_blank" rel="noopener">Start here</a> and the rest of the site to answer the tasks. We are evaluating the documentation. You may skip a task or stop. Your answers stay on this page until you download them; there is no upload or background storage. Refreshing loses unsaved answers.</p>
<noscript><section id="study-tasks"><h2>Reading tasks</h2><p>Entering and downloading a response here requires JavaScript. You can read these tasks and save your answers in a separate document.</p><ol><li><h3>Find the permission</h3><p>An agent has been assigned to investigate a missing export. Find what determines whether it may inspect the data or deploy a change.</p></li><li><h3>Prepare the assessment</h3><p>Use the Northstar files and prepare the shortest assessment you would send for review.</p></li><li><h3>Inspect standing</h3><p>Open the Work example and explain whether it is accepted and what would establish that.</p></li><li><h3>Explain continuation</h3><p>At 10:10 the task view expires. The permission period ends at 10:15. What can the agent do next? What survives if the session ends?</p></li><li><h3>Read Craft capacity</h3><p>What happens at 4/5, 5/5 and 6/5? Does Accept reserve a place?</p></li><li><h3>Try another situation</h3><p>An export for another account has 1,000 required identifiers and 1,000 output rows. Twenty-five required IDs are missing and replaced by other IDs. Values for the remaining rows have not been checked. What can you conclude, and what remains open?</p></li><li><h3>Explain the Lab</h3><p>Use the homepage to explain who the Lab serves and which problem it addresses.</p></li><li><h3>Establish availability</h3><p>Find what is available to inspect or use today and what is still under development.</p></li><li><h3>Find a research question</h3><p>Choose a research question discussed on the site. Explain how the Lab provides a setting for investigating it.</p></li><li><h3>Explore an application</h3><p>Find the robot-learning series. Explain one proposed use, then return to the Lab system explanation.</p></li><li><h3>Establish the extraction boundary</h3><p>Find which customer account, filters and source snapshot determine whether the Northstar export is complete. Explain whether inactive records from another account belong in the comparison.</p></li><li><h3>Distinguish a result from permission</h3><p>Find whether a calculated Accept permits a reservation or a deployment. Explain what would establish permission for the next action.</p></li></ol></section></noscript><form id="reader-form"><label for="participant">Anonymous participant code</label><input id="participant" name="participant" required placeholder="P01"><label for="role">Role or perspective (optional)</label><input id="role" name="role"><label for="familiarity">Prior Lab familiarity</label><select id="familiarity" name="familiarity"><option>None</option><option>Read a little</option><option>Used the model</option></select><label for="environment">Browser, device and any assistive technology</label><input id="environment" name="environment"><label for="consent"><input style="width:auto" type="checkbox" id="consent" name="consent" required> I agree to share these answers for this documentation review.</label>
<div id="tasks"></div><label for="comments">Anything difficult, useful or missing?</label><textarea id="comments" name="comments"></textarea><button type="submit" disabled>Download my response file</button><p id="download-status" role="status"></p></form>
<script>
const questions=[
['Find the permission','An agent has been assigned to investigate a missing export. Find what determines whether it may inspect the data or deploy a change.'],
['Prepare the assessment','Use the Northstar files and prepare the shortest assessment you would send for review.'],
['Inspect standing','Open the Work example and explain whether it is accepted and what would establish that.'],
['Explain continuation','At 10:10 the task view expires. The permission period ends at 10:15. What can the agent do next? What survives if the session ends?'],
['Read Craft capacity','What happens at 4/5, 5/5 and 6/5? Does Accept reserve a place?'],
['Try another situation','An export for another account has 1,000 required identifiers and 1,000 output rows. Twenty-five required IDs are missing and replaced by other IDs. Values for the remaining rows have not been checked. What can you conclude, and what remains open?'],
['Explain the Lab','Use the homepage to explain who the Lab serves and which problem it addresses.'],
['Establish availability','Find what is available to inspect or use today and what is still under development.'],
['Find a research question','Choose a research question discussed on the site. Explain how the Lab provides a setting for investigating it.'],
['Explore an application','Find the robot-learning series. Explain one proposed use, then return to the Lab system explanation.'],
['Establish the extraction boundary','Find which customer account, filters and source snapshot determine whether the Northstar export is complete. Explain whether inactive records from another account belong in the comparison.'],
['Distinguish a result from permission','Find whether a calculated Accept permits a reservation or a deployment. Explain what would establish permission for the next action.']];
const tasks=document.getElementById('tasks');
questions.forEach(([title,question],i)=>{const f=document.createElement('fieldset');const l=document.createElement('legend');l.textContent=(i+1)+'. '+title;f.append(l);const p=document.createElement('p');p.textContent=question;f.append(p);
for(const [key,label] of [['answer','Your answer'],['sources','Pages or sections you used'],['time','Elapsed time in minutes'],['assistance','Help needed, errors or confusing wording']]){const lab=document.createElement('label');const id='task-'+(i+1)+'-'+key;lab.htmlFor=id;lab.textContent=label;const el=document.createElement(key==='answer'||key==='assistance'?'textarea':'input');el.id=id;el.name=id;f.append(lab,el);}
const lab=document.createElement('label');lab.htmlFor='task-'+(i+1)+'-completion';lab.textContent='Task outcome';const sel=document.createElement('select');sel.id=lab.htmlFor;sel.name=sel.id;for(const text of ['Not attempted','Completed independently','Completed with help','Unable to complete']){const o=document.createElement('option');o.textContent=text;sel.append(o);}f.append(lab,sel);
const confidenceLabel=document.createElement('label');confidenceLabel.htmlFor='task-'+(i+1)+'-confidence';confidenceLabel.textContent='How confident are you in your answer?';const confidence=document.createElement('select');confidence.id=confidenceLabel.htmlFor;confidence.name=confidence.id;for(const text of ['Not answered','1 — Very unsure','2 — Unsure','3 — Somewhat sure','4 — Sure','5 — Very sure']){const option=document.createElement('option');option.textContent=text;confidence.append(option);}f.append(confidenceLabel,confidence);tasks.append(f);});
document.getElementById('reader-form').addEventListener('submit',event=>{event.preventDefault();const answers=Object.fromEntries(new FormData(event.target));const body={study:'lab-docs-formative-v1',task_set:'documentation-and-whole-site-v2',completed_at:new Date().toISOString(),answers};const url=URL.createObjectURL(new Blob([JSON.stringify(body,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='lab-docs-reader-'+String(answers.participant).replace(/[^a-zA-Z0-9_-]/g,'')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('download-status').textContent='Response file downloaded. Share it with the study facilitator if you choose.';});
document.querySelector('#reader-form button[type="submit"]').disabled=false;
</script></main></body></html>
