services:
  site:
    image: nginx:1.27-alpine
    container_name: coop-engine-site
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.domainspec.htpasswd:/etc/nginx/domainspec.htpasswd:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=${EDGE_NETWORK:-troqar_edge}
      - traefik.http.routers.coop-engine.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.coop-engine.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST is required}`)
      - traefik.http.routers.coop-engine.tls=true
      - traefik.http.routers.coop-engine.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.coop-engine.loadbalancer.server.port=80
    networks:
      - edge

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-troqar_edge}
