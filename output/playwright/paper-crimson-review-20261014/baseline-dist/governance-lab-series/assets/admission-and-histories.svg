<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="admission-and-histories-title admission-and-histories-desc"><title id="admission-and-histories-title">Review, acceptance and two separate histories</title><desc id="admission-and-histories-desc">A specific proposal goes to a Decision Bundle for review. An authorized Admission Transaction applies the accepted record changes together and saves the updated Project State. One history records what changed; the other records why it was accepted. Both identify the same change event.</desc><style>svg{
  color-scheme: light;
  --ds-canvas: #fdfaf3;
  --ds-surface: #fffdf8;
  --ds-subtle: #f3eee4;
  --ds-ink: #151515;
  --ds-muted: #625e57;
  --ds-border: #d8d1c4;
  --ds-control-border: #8a8276;
  --ds-accent: #bd1230;
  --ds-accent-hover: #991022;
  --ds-success: #246440;
  --ds-warning: #82520a;
  --ds-danger: #a51d2d;
  --ds-focus: #245eb0;
  --ds-font-ui: "Helvetica Neue", Arial, ui-sans-serif, system-ui, sans-serif;
  --ds-font-display: "Iowan Old Style", Baskerville, "Times New Roman", ui-serif, serif;
  --ds-font-code: ui-monospace, "Cascadia Code", monospace;
  --ds-text-meta: .75rem;
  --ds-text-label: .875rem;
  --ds-text-body: 1rem;
  --ds-text-lead: 1.125rem;
  --ds-space-1: .25rem;
  --ds-space-2: .5rem;
  --ds-space-3: .75rem;
  --ds-space-4: 1rem;
  --ds-space-6: 1.5rem;
  --ds-space-8: 2rem;
  --ds-space-12: 3rem;
  --ds-space-16: 4rem;
  --ds-radius: .25rem;
  --ds-control-height: 2.75rem;
  --ds-measure: 44rem;
  --ds-page-width: 76rem;
  --ds-motion: 140ms;
  /* Compatibility names for existing layouts and protocol diagrams. */
  --ink: var(--ds-ink); --text: var(--ds-ink); --black: #050505;
  --shell: #20252a; --paper: var(--ds-canvas); --surface: var(--ds-surface);
  --paper-soft: var(--ds-subtle); --line: var(--ds-border);
  --muted: var(--ds-muted); --dim: var(--ds-muted);
  --red: var(--ds-accent); --red-deep: var(--ds-accent-hover);
  --orange: #b94812; --amber: #f0a43c; --teal: #087773;
  --green: var(--ds-success); --blue: var(--ds-focus); --violet: #5c55b8;
  --mint: var(--ds-accent); --danger: var(--ds-danger);
  --shadow: 0 18px 60px rgb(21 21 21 / 12%);
  --shadow-soft: 0 10px 32px rgb(21 21 21 / 7%);
  --font-ui: var(--ds-font-ui); --font-display: var(--ds-font-display);
  font-family: var(--ds-font-ui);
}text{font-family:var(--ds-font-ui);fill:var(--ds-ink)}.node{fill:var(--ds-surface);stroke:var(--ds-border);stroke-width:1.4}.teal{fill:var(--ds-subtle);stroke:var(--ds-accent)}.blue{fill:var(--ds-canvas);stroke:var(--ds-focus)}.ochre{fill:var(--ds-subtle);stroke:var(--ds-warning)}.boundary{fill:none;stroke:var(--ds-control-border);stroke-width:1.4}.teal-boundary{fill:var(--ds-subtle);stroke:var(--ds-accent)}.blue-boundary{fill:var(--ds-subtle);stroke:var(--ds-focus)}.ochre-boundary{fill:var(--ds-subtle);stroke:var(--ds-warning)}.session-boundary{fill:var(--ds-canvas);stroke:var(--ds-control-border);stroke-dasharray:7 5}.connector{fill:none;stroke:var(--ds-muted);stroke-width:1.65}.dashed{stroke-dasharray:5 4}.node-title{font-size:20px;font-weight:600}.node-sub{font-size:16px;fill:var(--ds-muted)}.small-label{font-size:15px;font-weight:600;fill:var(--ds-muted)}.edge-label{font-size:16px;fill:var(--ds-muted)}@media(forced-colors:active){svg{--ds-ink:CanvasText;--ds-muted:CanvasText;--ds-canvas:Canvas;--ds-surface:Canvas;--ds-subtle:Canvas;--ds-border:ButtonBorder;--ds-control-border:ButtonBorder;--ds-accent:LinkText;--ds-focus:Highlight;--ds-warning:CanvasText}}/* Generated from lab_visual_language.py. */
svg{--lab-model-intent:#805616;--lab-model-product:#31547a;--lab-model-project:#23665f;--lab-model-work:#b94812;--lab-model-agent:#5c55b8;}
[data-theme="console"]{--lab-model-intent:#d5b072;--lab-model-product:#9ab9e4;--lab-model-project:#85c3b6;--lab-model-work:#eaa176;--lab-model-agent:#bcb4ff;}
[data-model-concept="intent"]{ --model-color:var(--lab-model-intent); --smap-color:var(--lab-model-intent); }
[data-model-concept="product"]{ --model-color:var(--lab-model-product); --smap-color:var(--lab-model-product); }
[data-model-concept="project"]{ --model-color:var(--lab-model-project); --smap-color:var(--lab-model-project); }
[data-model-concept="work"]{ --model-color:var(--lab-model-work); --smap-color:var(--lab-model-work); }
[data-model-concept="agent"]{ --model-color:var(--lab-model-agent); --smap-color:var(--lab-model-agent); }
.lab-icon, .diagram svg.lab-icon { display:block; width:1.375rem; height:1.375rem; min-width:0; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.model-heading { display:flex; align-items:center; gap:.75rem; }
.model-heading > .lab-icon { color:var(--model-color); }
.model-heading > span { min-width:0; }
.model-svg-node > rect, .model-svg-project > rect { fill:color-mix(in srgb,var(--model-color) 7%,var(--ds-surface)); stroke:var(--model-color); }
.model-svg-node > .node-title, .model-svg-project > .node-title { fill:var(--model-color); }
.model-svg-node > .model-svg-small-title { font-size:15px; }
.model-svg-icon { color:var(--model-color); fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.model-svg-session > .session-boundary { fill:color-mix(in srgb,var(--model-color) 4%,var(--ds-surface)); stroke:var(--model-color); }
.model-svg-session > .small-label { fill:var(--model-color); }
@media(forced-colors:active) {
  [data-model-concept] { --model-color:CanvasText; --smap-color:CanvasText; }
  .model-svg-node > rect, .model-svg-project > rect, .model-svg-session > .session-boundary { fill:Canvas; stroke:CanvasText; }
}
</style><defs><marker id="admission-and-histories-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ds-muted)"/></marker></defs><rect x="40" y="40" width="240" height="111" rx="4" class="node normal" /><text x="160.0" y="74" class="node-title" text-anchor="middle"><tspan x="160.0" dy="0">Specific proposal</tspan></text><text x="160.0" y="100" class="node-sub" text-anchor="middle"><tspan x="160.0" dy="0">Records, versions and </tspan><tspan x="160.0" dy="21">requested changes</tspan></text><rect x="380" y="40" width="240" height="111" rx="4" class="node ochre" /><text x="500.0" y="74" class="node-title" text-anchor="middle"><tspan x="500.0" dy="0">Decision bundle</tspan></text><text x="500.0" y="100" class="node-sub" text-anchor="middle"><tspan x="500.0" dy="0">Independent decisions, </tspan><tspan x="500.0" dy="21">one review checkpoint</tspan></text><rect x="720" y="40" width="240" height="111" rx="4" class="node teal" /><text x="840.0" y="74" class="node-title" text-anchor="middle"><tspan x="840.0" dy="0">Admission transaction</tspan></text><text x="840.0" y="100" class="node-sub" text-anchor="middle"><tspan x="840.0" dy="0">Accepted record changes </tspan><tspan x="840.0" dy="21">applied together</tspan></text><g class="diagram-connection"><path d="M282,96 L377,96" class="connector " marker-end="url(#admission-and-histories-arrow)" /><text class="edge-label" data-connection-label="true" data-label-text="review" x="301.18" y="74.4" text-anchor="start"><tspan x="301.18" dy="0">review</tspan></text></g><g class="diagram-connection"><path d="M622,96 L717,96" class="connector " marker-end="url(#admission-and-histories-arrow)" /><text class="edge-label" data-connection-label="true" data-label-text="authorize" x="627.02" y="74.4" text-anchor="start"><tspan x="627.02" dy="0">authorize</tspan></text></g><g class="diagram-connection"><path d="M840,153 L840,198 L500,198 L500,222" class="connector " marker-end="url(#admission-and-histories-arrow)" /></g><g class="model-svg-node" data-model-concept="project"><rect x="280" y="225" width="440" height="95" rx="4" class="node blue" /><g class="model-svg-icon" data-model-glyph="project" transform="translate(296,242)" aria-hidden="true"><path d="M3 3h18v5H3ZM5 8v13h14V8M9 12h6M10 16h4" /></g><text x="332" y="259" class="node-title" text-anchor="start"><tspan x="332" dy="0">Updated Project State</tspan></text><text x="500.0" y="285" class="node-sub" text-anchor="middle"><tspan x="500.0" dy="0">The saved result of the accepted changes</tspan></text></g><g class="diagram-connection"><path d="M392,322 L392,350 L265,350 L265,377" class="connector " marker-end="url(#admission-and-histories-arrow)" /></g><g class="diagram-connection"><path d="M607,322 L607,350 L735,350 L735,377" class="connector " marker-end="url(#admission-and-histories-arrow)" /></g><rect x="40" y="380" width="450" height="111" rx="4" class="node normal" /><text x="265.0" y="414" class="node-title" text-anchor="middle"><tspan x="265.0" dy="0">Change history</tspan></text><text x="265.0" y="440" class="node-sub" text-anchor="middle"><tspan x="265.0" dy="0">What changed? </tspan><tspan x="265.0" dy="21">The preceding state and resulting state.</tspan></text><rect x="510" y="380" width="450" height="111" rx="4" class="node normal" /><text x="735.0" y="414" class="node-title" text-anchor="middle"><tspan x="735.0" dy="0">Approval history</tspan></text><text x="735.0" y="440" class="node-sub" text-anchor="middle"><tspan x="735.0" dy="0">Why was it accepted? </tspan><tspan x="735.0" dy="21">Decision, authorization and applicable rules.</tspan></text><text x="500" y="535" class="edge-label" text-anchor="middle"><tspan x="500" dy="0">Both histories refer to the same specific change event.</tspan></text></svg>