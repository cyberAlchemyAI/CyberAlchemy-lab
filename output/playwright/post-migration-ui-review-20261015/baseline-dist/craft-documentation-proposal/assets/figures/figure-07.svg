<svg xmlns="http://www.w3.org/2000/svg" width="840" height="680" viewBox="0 0 840 680" role="img" aria-labelledby="title desc">
<title id="title">Revising a condition and adding reservation require different design changes</title><desc id="desc">Allowing equality revises the acceptance definition, Rule and expected outcomes. Reserving capacity adds a state-changing responsibility with ownership, consistency and failure contracts. Each successor needs design review and its own construction and evaluation evidence.</desc>
