 y="314.0" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">Revise meaning</text><text x="202.5" y="336.0" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">Definition and Rule predicate</text></g><g><rect x="465" y="275" width="345" height="90" rx="7" fill="#f5f0fa" stroke="#9c83b5" stroke-width="1.5"/><text x="637.5" y="314.0" text-anchor="middle" fill="#4e366b" font-size="16" font-weight="600">Add reservation responsibility</text><text x="637.5" y="336.0" text-anchor="middle" fill="#4e366b" font-size="15" font-weight="400">State owner, writes and failures</text></g><g><rect x="30" y="420" width="345" height="90" rx="7" fill="#fff3e9" stroke="#c68455" stroke-width="1.5"/><text x="202.5" y="459.0" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">Revise expected</text><text x="202.5" y="481.0" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">boundary outcomes</text></g><g><rect x="465" y="420" width="345" height="90" rx="7" fill="#f5f0fa" stroke="#9c83b5" stroke-width="1.5"/><text x="637.5" y="448.0" text-anchor="middle" fill="#4e366b" font-size="16" font-weight="600">Specify coordinated check and</text><text x="637.5" y="470.0" text-anchor="middle" fill="#4e366b" font-size="16" font-weight="600">mutation</text><text x="637.5" y="492.0" text-anchor="middle" fill="#4e366b" font-size="15" font-weight="400">For overlapping requests</text></g><g><rect x="230" y="575" width="380" height="85" rx="7" fill="#f7f4ed" stroke="#a49b8c" stroke-width="1.5"/><text x="420.0" y="600.5" text-anchor="middle" fill="#242322" font-size="16" font-weight="600">Review the successor model</text><text x="420.0" y="622.5" text-anchor="middle" fill="#242322" font-size="15" font-weight="400">Compile supported contracts</text><text x="420.0" y="644.5" text-anchor="middle" fill="#242322" font-size="15" font-weight="400">Collect new evidence</text></g></g></svg>