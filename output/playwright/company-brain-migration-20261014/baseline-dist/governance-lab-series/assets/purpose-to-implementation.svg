<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="purpose-to-implementation-title purpose-to-implementation-desc"><title id="purpose-to-implementation-title">From the reported problem to the agent’s investigation job</title><desc id="purpose-to-implementation-desc">Intent states the desired change. Intent Resolution selects a response and satisfaction test. The value column identifies the Product, Product Capability, version-specific realization binding and Implementation. The work column identifies the repair Project, Goal, investigation Work and Agent Assignment. The Incident keeps its response and closure responsibilities.</desc><style>svg{
  color-scheme: light;
  --ds-canvas: #fdfaf3;
  --ds-surface: #fffdf8;
  --ds-subtle: #f3eee4;
  --ds-ink: #151515;
  --ds-muted: #625e57;
  --ds-border: #d8d1c4;
  --ds-control-border: #8a8276;
  --ds-accent: #bd1230;
  --ds-accent-hover: #991022;
  --ds-success: #246440;
  --ds-warning: #82520a;
  --ds-danger: #a51d2d;
  --ds-focus: #245eb0;
  --ds-font-ui: "Helvetica Neue", Arial, ui-sans-serif, system-ui, sans-serif;
  --ds-font-display: "Iowan Old Style", Baskerville, "Times New Roman", ui-serif, serif;
  --ds-font-code: ui-monospace, "Cascadia Code", monospace;
  --ds-text-meta: .75rem;
  --ds-text-label: .875rem;
  --ds-text-body: 1rem;
  --ds-text-lead: 1.125rem;
  --ds-space-1: .25rem;
  --ds-space-2: .5rem;
  --ds-space-3: .75rem;
  --ds-space-4: 1rem;
  --ds-space-6: 1.5rem;
  --ds-space-8: 2rem;
  --ds-space-12: 3rem;
  --ds-space-16: 4rem;
  --ds-radius: .25rem;
  --ds-control-height: 2.75rem;
  --ds-measure: 44rem;
  --ds-page-width: 76rem;
  --ds-motion: 140ms;
  /* Compatibility names for existing layouts and protocol diagrams. */
  --ink: var(--ds-ink); --text: var(--ds-ink); --black: #050505;
  --shell: #20252a; --paper: var(--ds-canvas); --surface: var(--ds-surface);
  --paper-soft: var(--ds-subtle); --line: var(--ds-border);
  --muted: var(--ds-muted); --dim: var(--ds-muted);
  --red: var(--ds-accent); --red-deep: var(--ds-accent-hover);
  --orange: #b94812; --amber: #f0a43c; --teal: #087773;
  --green: var(--ds-success); --blue: var(--ds-focus); --violet: #5c55b8;
  --mint: var(--ds-accent); --danger: var(--ds-danger);
  --shadow: 0 18px 60px rgb(21 21 21 / 12%);
