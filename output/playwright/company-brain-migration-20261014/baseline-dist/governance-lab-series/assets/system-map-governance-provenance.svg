<svg xmlns="http://www.w3.org/2000/svg" class="smap-diagram" viewBox="0 0 1160 650" role="group" aria-labelledby="smap-governance-provenance-title smap-governance-provenance-desc"><title id="smap-governance-provenance-title">Provenance · CyberAlchemy Lab concept map</title><desc id="smap-governance-provenance-desc">Trace evidence to its source files and versions. Explain the conditions under which it supports a claim. Supporting evidence and permission to decide are separate facts. Select a node for its role, example and connections. Arrows are explanatory role connections.</desc><style>svg{
  color-scheme: light;
  --ds-canvas: #fdfaf3;
  --ds-surface: #fffdf8;
  --ds-subtle: #f3eee4;
  --ds-ink: #151515;
  --ds-muted: #625e57;
  --ds-border: #d8d1c4;
  --ds-control-border: #8a8276;
  --ds-accent: #bd1230;
  --ds-accent-hover: #991022;
  --ds-success: #246440;
  --ds-warning: #82520a;
  --ds-danger: #a51d2d;
  --ds-focus: #245eb0;
  --ds-font-ui: "Helvetica Neue", Arial, ui-sans-serif, system-ui, sans-serif;
  --ds-font-display: "Iowan Old Style", Baskerville, "Times New Roman", ui-serif, serif;
  --ds-font-code: ui-monospace, "Cascadia Code", monospace;
  --ds-text-meta: .75rem;
  --ds-text-label: .875rem;
  --ds-text-body: 1rem;
  --ds-text-lead: 1.125rem;
  --ds-space-1: .25rem;
  --ds-space-2: .5rem;
  --ds-space-3: .75rem;
  --ds-space-4: 1rem;
  --ds-space-6: 1.5rem;
  --ds-space-8: 2rem;
  --ds-space-12: 3rem;
  --ds-space-16: 4rem;
  --ds-radius: .25rem;
  --ds-control-height: 2.75rem;
  --ds-measure: 44rem;
  --ds-page-width: 76rem;
  --ds-motion: 140ms;
  /* Compatibility names for existing layouts and protocol diagrams. */
  --ink: var(--ds-ink); --text: var(--ds-ink); --black: #050505;
  --shell: #20252a; --paper: var(--ds-canvas); --surface: var(--ds-surface);
  --paper-soft: var(--ds-subtle); --line: var(--ds-border);
  --muted: var(--ds-muted); --dim: var(--ds-muted);
  --red: var(--ds-accent); --red-deep: var(--ds-accent-hover);
  --orange: #b94812; --amber: #f0a43c; --teal: #087773;
  --green: var(--ds-success); --blue: var(--ds-focus); --violet: #5c55b8;
  --mint: var(--ds-accent); --danger: var(--ds-danger);
  --shadow: 0 18px 60px rgb(21 21 21 / 12%);
  --shadow-soft: 0 10px 32px rgb(21 21 21 / 7%);
  --font-ui: var(--ds-font-ui); --font-display: var(--ds-font-display);
  font-family: var(--ds-font-ui);
background:var(--ds-surface)}
.system-map, .smap-diagram {
  --smap-purpose: #b94812;
  --smap-governance: #bd1230;
  --smap-records: #245eb0;
  --smap-knowledge: #087773;
  --smap-agents: #5c55b8;
  --smap-evidence: #82520a;
  --smap-learning: #246440;
}
.smap-family-purpose { --smap-color: var(--smap-purpose); }
.smap-family-governance { --smap-color: var(--smap-governance); }
.smap-family-records { --smap-color: var(--smap-records); }
.smap-family-knowledge { --smap-color: var(--smap-knowledge); }
.smap-family-agents { --smap-color: var(--smap-agents); }
.smap-family-evidence { --smap-color: var(--smap-evidence); }
.smap-family-learning { --smap-color: var(--smap-learning); }
.smap-node { --smap-wash: color-mix(in srgb, var(--smap-color) 6%, var(--ds-surface)); --smap-soft: color-mix(in srgb, var(--smap-color) 13%, var(--ds-surface)); cursor: pointer; }
.smap-node > rect { fill: var(--smap-wash); stroke: color-mix(in srgb, var(--smap-color) 44%, var(--ds-border)); stroke-width: 1.4; }
.smap-node-rail { stroke: var(--smap-color); stroke-width: 3; stroke-linecap: round; fill: none; pointer-events: none; }
.smap-node-icon-disc { fill: var(--smap-soft); stroke: none; pointer-events: none; }
.smap-node-glyph { color: var(--smap-color); pointer-events: none; }
.smap-node-title { fill: var(--ds-ink); font: 500 18px var(--ds-font-ui); pointer-events: none; }
.smap-node-subtitle { fill: var(--ds-muted); font: 14px var(--ds-font-ui); pointer-events: none; }
.smap-ephemeral > rect { stroke-dasharray: 5 4; }
.smap-node:hover > rect, .smap-node.is-neighbor > rect { stroke: var(--smap-color); stroke-width: 2; }
.smap-node.is-selected > rect { fill: var(--smap-soft); stroke: var(--smap-color); stroke-width: 3; }
.smap-node.is-selected .smap-node-title { fill: var(--ds-ink); font-weight: 650; }
.smap-node.is-selected .smap-node-icon-disc { fill: var(--smap-color); }
.smap-node.is-selected .smap-node-glyph { color: var(--ds-surface); }
.smap-node:focus-visible > rect { stroke: var(--ds-focus); stroke-width: 3; }
.smap-glyph { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.smap-node .smap-glyph rect { fill: none; stroke: currentColor; stroke-width: 1.8; }
.smap-edge-path { fill: none; stroke: color-mix(in srgb, var(--smap-color) 58%, var(--ds-border)); stroke-width: 1.5; }
.smap-diagram marker path { fill: var(--smap-color); }
.smap-edge-label { fill: var(--smap-color); font: 16px var(--ds-font-code); paint-order: stroke; stroke: var(--ds-surface); stroke-width: 5; stroke-linejoin: round; }
.smap-edge.is-active .smap-edge-path { stroke: var(--smap-color); stroke-width: 2.5; }
.smap-edge.is-active .smap-edge-label { fill: var(--smap-color); }
.smap-boundary { fill: color-mix(in srgb, var(--smap-agents) 4%, var(--ds-surface)); stroke: color-mix(in srgb, var(--smap-agents) 45%, var(--ds-border)); stroke-dasharray: 4 4; }
.smap-boundary-label { fill: var(--smap-agents); font: 14px var(--ds-font-code); }
.smap-section-label { fill: var(--ds-muted); font: 16px var(--ds-font-code); letter-spacing: .04em; }
/* Generated from lab_visual_language.py. */
svg{--lab-model-intent:#805616;--lab-model-product:#31547a;--lab-model-project:#23665f;--lab-model-work:#b94812;--lab-model-agent:#5c55b8;}
[data-theme="console"]{--lab-model-intent:#d5b072;--lab-model-product:#9ab9e4;--lab-model-project:#85c3b6;--lab-model-work:#eaa176;--lab-model-agent:#bcb4ff;}
[data-model-concept="intent"]{ --model-color:var(--lab-model-intent); --smap-color:var(--lab-model-intent); }
[data-model-concept="product"]{ --model-color:var(--lab-model-product); --smap-color:var(--lab-model-product); }
[data-model-concept="project"]{ --model-color:var(--lab-model-project); --smap-color:var(--lab-model-project); }
[data-model-concept="work"]{ --model-color:var(--lab-model-work); --smap-color:var(--lab-model-work); }
[data-model-concept="agent"]{ --model-color:var(--lab-model-agent); --smap-color:var(--lab-model-agent); }
.lab-icon, .diagram svg.lab-icon { display:block; width:1.375rem; height:1.375rem; min-width:0; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.model-heading { display:flex; align-items:center; gap:.75rem; }
.model-heading > .lab-icon { color:var(--model-color); }
.model-heading > span { min-width:0; }
.model-svg-node > rect, .model-svg-project > rect { fill:color-mix(in srgb,var(--model-color) 7%,var(--ds-surface)); stroke:var(--model-color); }
.model-svg-node > .node-title, .model-svg-project > .node-title { fill:var(--model-color); }
.model-svg-node > .model-svg-small-title { font-size:15px; }
.model-svg-icon { color:var(--model-color); fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.model-svg-session > .session-boundary { fill:color-mix(in srgb,var(--model-color) 4%,var(--ds-surface)); stroke:var(--model-color); }
.model-svg-session > .small-label { fill:var(--model-color); }
@media(forced-colors:active) {
  [data-model-concept] { --model-color:CanvasText; --smap-color:CanvasText; }
  .model-svg-node > rect, .model-svg-project > rect, .model-svg-session > .session-boundary { fill:Canvas; stroke:CanvasText; }
}
