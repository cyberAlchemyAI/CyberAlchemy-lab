<svg xmlns="http://www.w3.org/2000/svg" width="850" height="550" viewBox="0 0 850 550" role="img" aria-labelledby="title desc">
<title id="title">Project state carries design knowledge between ephemeral agent sessions</title><desc id="desc">A session records its work in durable project state. Context views select task-relevant information, and ontology views expose recorded concepts and relationships. A later ephemeral session uses those views while maintaining only its own short-term memory.</desc>
