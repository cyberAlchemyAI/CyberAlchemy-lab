ect x="350" y="270" width="210" height="75" rx="7" fill="#eef4fb" stroke="#6488b6" stroke-width="1.5"/><text x="455.0" y="301.5" text-anchor="middle" fill="#17395f" font-size="16" font-weight="600">New Context View</text><text x="455.0" y="323.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">Task-relevant selection</text></g><g><rect x="610" y="270" width="210" height="75" rx="7" fill="#eef4fb" stroke="#6488b6" stroke-width="1.5"/><text x="715.0" y="301.5" text-anchor="middle" fill="#17395f" font-size="16" font-weight="600">New Ontology View</text><text x="715.0" y="323.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">Concepts and connections</text></g><g><rect x="450" y="425" width="270" height="105" rx="7" fill="#fff3e9" stroke="#c68455" stroke-width="1.5"/><text x="585.0" y="460.5" text-anchor="middle" fill="#703a1a" font-size="16" font-weight="600">Agent session B</text><text x="585.0" y="482.5" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">Ephemeral worker</text><text x="585.0" y="504.5" text-anchor="middle" fill="#703a1a" font-size="15" font-weight="400">New session memory</text></g><g><rect x="204.2" y="97" width="141.60000000000002" height="30" rx="4" fill="#fffdf8"/><text x="275" y="117" text-anchor="middle" font-size="16" fill="#514c46">governed write</text></g></g></svg>