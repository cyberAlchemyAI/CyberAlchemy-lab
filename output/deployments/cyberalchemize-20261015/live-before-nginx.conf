server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /craft {
        try_files /craft/index.html =404;
    }

    location = /craft/ {
        return 308 /craft;
    }

    location = /craft/index.html {
        return 308 /craft;
    }

    location = /bella {
        try_files /bella/index.html =404;
    }

    location = /bella/ {
        return 308 /bella;
    }

    location = /bella/index.html {
        return 308 /bella;
    }

    location = /agent-orchestration-guide {
        try_files /agent-orchestration-guide/index.html =404;
    }

    location = /agent-orchestration-guide/ {
        return 308 /agent-orchestration-guide;
    }

    location = /agent-orchestration-guide/index.html {
        return 308 /agent-orchestration-guide;
    }

    location = /agent-orchestration {
        try_files /agent-orchestration-guide/index.html =404;
    }

    location = /agent-orchestration/ {
        return 308 /agent-orchestration;
    }

    location = /agent-orchestration/index.html {
        return 308 /agent-orchestration;
    }

    location = /domainspec {
        return 308 /domainspec/;
    }

    location = /domainspec/ {
        auth_basic "DomainSpec guide";
        auth_basic_user_file /etc/nginx/domainspec.htpasswd;

        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Vary "Authorization" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        try_files /domainspec/index.html =404;
    }

    location ^~ /domainspec/ {
        auth_basic "DomainSpec guide";
        auth_basic_user_file /etc/nginx/domainspec.htpasswd;

        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Vary "Authorization" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
