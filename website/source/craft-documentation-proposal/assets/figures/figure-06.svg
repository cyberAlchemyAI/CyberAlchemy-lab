<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" role="img" aria-labelledby="title desc">
<title id="title">Four separate questions about the capacity implementation</title><desc id="desc">Model validation checks declarations and connections. Artifact verification checks code against its selection. Behavioral evaluation checks execution against expected outcomes. Completion review checks which required actions have evidence of performance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#817a70"/></marker></defs>
<rect width="100%" height="100%" fill="#fffdf8"/>
<g font-family="Helvetica Neue, Arial, sans-serif"><path d="M 460,90 L 460,130 L 115,130 L 115,180" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 460,90 L 460,130 L 345,130 L 345,180" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 460,90 L 460,130 L 575,130 L 575,180" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 460,90 L 460,130 L 805,130 L 805,180" fill="none" stroke="#817a70" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="300" y="20" width="320" height="70" rx="7" fill="#f7f4ed" stroke="#a49b8c" stroke-width="1.5"/><text x="460.0" y="60.0" text-anchor="middle" fill="#242322" font-size="16" font-weight="600">Selected capacity implementation</text></g><g><rect x="20" y="180" width="190" height="145" rx="7" fill="#eef4fb" stroke="#6488b6" stroke-width="1.5"/><text x="115.0" y="224.5" text-anchor="middle" fill="#17395f" font-size="16" font-weight="600">Model validation</text><text x="115.0" y="246.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">Declarations and</text><text x="115.0" y="268.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">connections</text><text x="115.0" y="290.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">consistent?</text></g><g><rect x="250" y="180" width="190" height="145" rx="7" fill="#eef4fb" stroke="#6488b6" stroke-width="1.5"/><text x="345.0" y="224.5" text-anchor="middle" fill="#17395f" font-size="16" font-weight="600">Artifact verification</text><text x="345.0" y="246.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">Target matches the</text><text x="345.0" y="268.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">selected</text><text x="345.0" y="290.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">implementation?</text></g><g><rect x="480" y="180" width="190" height="145" rx="7" fill="#eef4fb" stroke="#6488b6" stroke-width="1.5"/><text x="575.0" y="235.5" text-anchor="middle" fill="#17395f" font-size="16" font-weight="600">Behavioral evaluation</text><text x="575.0" y="257.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">Execution produces</text><text x="575.0" y="279.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">expected decisions?</text></g><g><rect x="710" y="180" width="190" height="145" rx="7" fill="#eef4fb" stroke="#6488b6" stroke-width="1.5"/><text x="805.0" y="213.5" text-anchor="middle" fill="#17395f" font-size="16" font-weight="600">Completion review</text><text x="805.0" y="235.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">Which required</text><text x="805.0" y="257.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">actions</text><text x="805.0" y="279.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">were actually</text><text x="805.0" y="301.5" text-anchor="middle" fill="#17395f" font-size="15" font-weight="400">performed?</text></g></g></svg>