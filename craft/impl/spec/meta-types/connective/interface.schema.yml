# DomainSpec v2 meta-type schema — Interface (Connective). SCHEMA-CONSTITUTION; companion interface.md.
# Declared-attributes convention (owner decision 2026-07-02). Shape only, no moat. Edge sigs deferred to R3.
meta_type: Interface
category: connective
companion: interface.md
code_pattern: API boundary exposing operations/queries; maps external shapes to domain concepts

required_structure:
  attributes_table_columns: [Attribute, Value]

criterion:
  declares_boundary:
    rule: attribute-present
    key: interface_kind

distinguisher:
  vs: Mapping
  rule: an Interface is an exposed boundary (interface_kind external|internal); a Mapping is a field transform

edge_participation:
  source_of: [exposes]
  target_of: [contracts, maps]

fixtures:
  positive: spec/__fixtures__/mt/interface-ok.md
  negative: spec/__fixtures__/mt/interface-bad.md
