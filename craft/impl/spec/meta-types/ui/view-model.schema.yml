# DomainSpec v2 development UI profile — View Model. Not canonical DS-D1 authority.
meta_type: View Model
category: ui-development
companion: view-model.md
lifecycle_status: development-profile
candidate_id: DS-D1.18
authority_boundary: implementation-owned development profile only
required_structure:
  attributes_table_columns: [Attribute, Value]
criterion:
  typed_fields:
    rule: attribute-nonempty/v1
    key: typed_fields
  source_refs:
    rule: attribute-nonempty/v1
    key: source_refs
  display_context:
    rule: attribute-nonempty/v1
    key: display_context
  display_roles:
    rule: attribute-nonempty/v1
    key: display_roles
  domain_authority:
    rule: attribute-equals
    key: domain_authority
    value: "false"
distinguisher:
  vs: Value Object
  rule: a View Model is display-scoped and non-authoritative; a Value Object owns domain equality
edge_participation:
  source_of: [derives]
  target_of: [shapes, displays]
correction_contract: add source-backed display structure and non-domain authority, or reroute domain equality to Value Object
