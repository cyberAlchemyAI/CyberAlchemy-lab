# DomainSpec v2 meta-type schema — Rule (Behavioral). SCHEMA-CONSTITUTION; companion rule.md.
# The boolean-predicate discriminator is the DECLARED formal_return_type key (frozen formalism findings):
# never parse the Formal cell — that is the engine moat.
meta_type: Rule
category: behavioral
companion: rule.md
code_pattern: boolean guard on an operation (blocks/allows; formal expression is boolean)

required_structure:
  attributes_table_columns: [Attribute, Value]

criterion:
  boolean_predicate:
    rule: attribute-equals
    key: formal_return_type
    value: boolean

distinguisher:
  vs: Policy
  rule: a Rule returns a boolean (blocks/allows); a Policy selects a strategy

edge_participation:
  source_of: [enforces]
  target_of: [mirrors]

fixtures:
  positive: spec/__fixtures__/mt/rule-ok.md
  negative: spec/__fixtures__/mt/rule-bad.md
