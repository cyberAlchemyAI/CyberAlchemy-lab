# DomainSpec v2 meta-type schema — Calculation (Behavioral). SCHEMA-CONSTITUTION; companion calculation.md.
meta_type: Calculation
category: behavioral
companion: calculation.md
code_pattern: pure function deriving a value from inputs (deterministic; no state change)

required_structure:
  attributes_table_columns: [Attribute, Value]

criterion:
  returns_value:
    rule: attribute-equals
    key: formal_return_type
    value: value

distinguisher:
  vs: Rule
  rule: a Calculation returns a value (formal_return_type=value); a Rule returns a boolean

edge_participation:
  source_of: [calculates]
  target_of: [applies]

fixtures:
  positive: spec/__fixtures__/mt/calculation-ok.md
  negative: spec/__fixtures__/mt/calculation-bad.md
