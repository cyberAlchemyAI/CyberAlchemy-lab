text_intent_substrate:
  metadata:
    substrate_version: "0.1"
    transport_type: plain_language_technical_guide
    artifact_status: candidate_internal_guide
    source_packet: "2026-07-17-domainspec-evolvable-validation-framework"

  source_context:
    raw_author_intent: "Explain the path from a DomainSpec graph to a composability proof and test derivation to someone who knows none of the terms."
    source_findings: "projects/domainspec-v2/research/evolvable-validation-framework/findings.md"
    audience_correction: "Use ordinary words first; define every technical term before using it as shorthand."

  author_objective:
    primary_outcome: clarify
    desired_reader_change: "The reader can describe the graph-to-test-to-receipt path and distinguish structural validity from composability proof."
    success_signal: "The reader can explain what a node, edge, obligation, test case, binding, evaluator, and receipt do in the worked example."
    author_stance: teaching_partner

  resonance_core:
    tone: "calm, concrete, patient"
    voice: "a senior collaborator explaining a new system to a smart beginner"
    style_register: plain_spoken
    emotional_residue: "the reader feels the system is understandable and has a reachable first step"
    value_signal: "clear boundaries are more useful than impressive jargon"
    forbidden_feels:
      - "mysterious formal-method lecture"
      - "false certainty"
      - "jargon without an example"
      - "claiming the engine is complete"

  relevance_core:
    target_public: "a DomainSpec collaborator who knows ordinary software concepts but not this vocabulary"
    reader_state: beginner
    domain: "DomainSpec graph composability and deterministic test derivation"
    authority_mode: internal research explanation
    assumed_knowledge:
      - "basic idea of a file and a software test"
    likely_objections:
      - "Why do we need both a graph and tests?"
      - "What does composable mean here?"
      - "Is a passing validator already proof?"
    reader_reward: "a simple mental model and a concrete next implementation slice"

  trajectory_core:
    narrative_anchor: "a map of boxes and arrows that becomes a checklist and then evidence"
    transport_type: plain_language_technical_guide
    introduction_strategy: concrete_analogy
    body_parts:
      - the_map_analogy
      - small_glossary
      - worked_rule_enforces_operation_example
      - test_derivation_bridge
      - levels_of_proof
      - current_state_and_next_slice
    ending_strategy: actionable_summary
    length_words:
      min: 650
      max: 1400
    must_include:
      - "DomainSpec"
      - "node"
      - "edge"
      - "obligation"
      - "test case"
      - "binding"
      - "receipt"
      - "composability"
      - "what is proven"
      - "what is still missing"
    must_avoid:
      - "unbounded proof claim"
      - "universal solver claim"
      - "treating Inventory as authority"

  transport_schema:
    transport_id: plain_language_technical_guide
    transport_category: internal_documentation
    target_context: "A beginner-friendly explanation linked from the DomainSpec v2 research result"
    introduction_required: true
    length_words:
      min: 650
      max: 1400
    max_characters: 12000
    opening_contract:
      first_paragraph_role: reader_grounded_hook
      purpose: "Start with a map of boxes and arrows before introducing DomainSpec vocabulary."
      external_reference_policy:
        external_reference_terms: []
        allowed_after_paragraph: 1
      validation_rules:
        first_paragraph_must_include_any:
          - "map"
          - "box"
          - "arrow"
          - "graph"
        draft_must_include_anywhere:
          - "DomainSpec"
          - "composability"
          - "obligation"
          - "test case"
          - "receipt"
    evidence_policy: "Use only the cited local findings and clearly label candidate or missing evidence."

  composition_plan:
    source_candidate_set: beginner-guide-v1
    construction_sequence:
      - the_map_analogy
      - small_glossary
      - worked_rule_enforces_operation_example
      - test_derivation_bridge
      - levels_of_proof
      - current_state_and_next_slice

  draft_artifact:
    target_path: "projects/domainspec-v2/research/evolvable-validation-framework/whisper/plain-language-guide.md"
    source_schema: "projects/domainspec-v2/research/evolvable-validation-framework/whisper/text-intent-substrate.yaml"

  validation:
    checks:
      - first paragraph starts with ordinary map analogy
      - every new term is defined before shorthand use
      - worked example follows source-to-receipt path
      - proven and missing states are separated
      - no universal or unbounded proof claim
      - no Inventory authority claim
    review_mode: guided-auto

  learning_residue:
    status: capture_after
    capture_after:
      - reader_feedback_on_terms
      - first_end_to_end_composability_fixture
      - whether the glossary needs a diagram
    residue_slots:
      - "A future visual may replace some prose once the first runnable receipt exists."
